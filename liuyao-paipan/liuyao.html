<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>六爻納甲排盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="六爻納甲排盤：數字、手動六爻、時間起卦；本卦變卦、世應、六親、六神、伏神、旬空，月建日辰生剋沖合與依力量排序的關係清單，附《周易》原文。">
<style>
/* 版面：桌面左側導覽＋右側內容；手機頂部分頁。與同倉庫八字排盤共用一套色票與元件樣式。
   配色只給底色、卡片、文字、主色、抬頭帶幾個基礎色，其餘由 color-mix 混出。 */
:root {
  --bg: #F3F4F6;
  --card: #FFFFFF;
  --ink: #1F2328;
  --accent: #4A5B8C;
  --on-accent: #FFFFFF;
  --bar: #1F2430;
  --bar-ink: #E6EAF2;
  --mu: #1A973D; --huo: #D2261E; --tu: #8A681B; --jin: #D5820A; --shui: #2B62D5;
  --danger: #B42318;
  --good: #1F7A45;
  --warn: #A45D00;
  --shadow: 0 1px 2px rgba(20, 24, 32, .05), 0 6px 18px rgba(20, 24, 32, .05);
  --card-2: color-mix(in srgb, var(--ink) 4%, var(--card));
  --ink-2: color-mix(in srgb, var(--ink) 74%, var(--card));
  --dim: color-mix(in srgb, var(--ink) 54%, var(--card));
  --line: color-mix(in srgb, var(--ink) 12%, var(--card));
  --line-2: color-mix(in srgb, var(--ink) 6%, var(--card));
  --gold: var(--accent);
  --gold-ink: color-mix(in srgb, var(--accent) 80%, var(--ink));
  --gold-soft: color-mix(in srgb, var(--accent) 15%, var(--card));
  --gold-softer: color-mix(in srgb, var(--accent) 6%, var(--card));
  --chip: color-mix(in srgb, var(--ink) 6%, var(--card));
  --scroll: color-mix(in srgb, var(--ink) 26%, var(--card));
  --bar-2: color-mix(in srgb, var(--bar-ink) 9%, var(--bar));
  --bar-dim: color-mix(in srgb, var(--bar-ink) 62%, var(--bar));
  --bar-accent: color-mix(in srgb, var(--accent) 50%, var(--bar-ink));
  --btn: var(--bar);
  --btn-ink: var(--bar-accent);
  --bad-bg: color-mix(in srgb, var(--danger) 11%, var(--card));
  --good-bg: color-mix(in srgb, var(--good) 12%, var(--card));
  --warn-bg: color-mix(in srgb, var(--warn) 13%, var(--card));
  --r: 14px;
  --f-serif: "Songti TC", "STSong", "Noto Serif CJK TC", "Source Han Serif TC", "Noto Serif TC", "PMingLiU", "SimSun", serif;
  --f-sans: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Hiragino Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111214; --card: #1A1C20; --ink: #E8EAED; --accent: #8AB4F8; --on-accent: #10131A;
    --bar: #0B0C0E; --bar-ink: #DDE3EC;
    --mu: #58CF78; --huo: #FF6B5E; --tu: #D4AA5E; --jin: #F2AA3A; --shui: #73A2FF;
    --danger: #FF7B6E; --good: #5BC98A; --warn: #F0B45A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111214; --card: #1A1C20; --ink: #E8EAED; --accent: #8AB4F8; --on-accent: #10131A;
  --bar: #0B0C0E; --bar-ink: #DDE3EC;
  --mu: #58CF78; --huo: #FF6B5E; --tu: #D4AA5E; --jin: #F2AA3A; --shui: #73A2FF;
  --danger: #FF7B6E; --good: #5BC98A; --warn: #F0B45A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-sans); font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.serif { font-family: var(--f-serif); }
.num { font-variant-numeric: tabular-nums; }
.w0 { color: var(--mu); } .w1 { color: var(--huo); } .w2 { color: var(--tu); } .w3 { color: var(--jin); } .w4 { color: var(--shui); }
.dim { color: var(--dim); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- 外框 ---------- */
.app {
  display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 20px;
  max-width: 1500px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; display: flex; flex-direction: column; gap: 6px; }
.nav-brand { font-family: var(--f-serif); font-weight: 700; font-size: 18px; letter-spacing: .08em; color: var(--ink); padding: 6px 14px 12px; }
.nav-brand small { display: block; font-family: var(--f-sans); font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--dim); }
.nav-item { text-align: left; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); font-size: 15px; position: relative; }
.nav-item:hover { border-color: var(--gold); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.nav-item[aria-current="page"]::before { content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--gold); }
.nav-item .dot { position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--gold); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.page { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

@media (max-width: 899px) {
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
  .app { display: block; padding: 0 0 40px; }
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; flex-direction: row; gap: 0; background: var(--bar);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); margin-bottom: 14px;
  }
  .nav-brand { display: none; }
  .nav-item { flex: 1 1 0; min-width: 0; text-align: center; border: 0; border-radius: 0; background: transparent; color: var(--bar-dim); padding: 13px 2px 11px; font-size: 14px; white-space: nowrap; }
  .nav-item:hover { color: var(--bar-ink); border-color: transparent; }
  .nav-item[aria-current="page"] { background: transparent; color: var(--bar-accent); font-weight: 700; }
  .nav-item[aria-current="page"]::before { left: 24%; right: 24%; top: auto; bottom: 0; width: auto; height: 3px; border-radius: 3px 3px 0 0; background: var(--bar-accent); }
  .nav-item .dot { right: 50%; top: 7px; margin: 0 -14px 0 0; width: 6px; height: 6px; background: var(--bar-accent); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* ---------- 通用 ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-pad { padding: 18px 20px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.card-title { font-family: var(--f-serif); font-size: 17px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-title small { font-family: var(--f-sans); font-size: 12px; font-weight: 400; color: var(--dim); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--gold); }
.btn-gold { background: var(--gold); border-color: var(--gold); color: var(--on-accent); }
.btn-gold:hover { filter: brightness(1.06); }
.btn-dark { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); font-weight: 700; letter-spacing: .12em; }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn-danger.solid { background: var(--danger); color: var(--card); border-color: var(--danger); }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.hint { font-size: 12.5px; color: var(--dim); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 4px; background: var(--chip); color: var(--ink-2); font-size: 12px; line-height: 1.6; white-space: nowrap; border: 1px solid transparent; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--danger); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.kong { background: transparent; border: 1px dashed var(--dim); color: var(--ink-2); }
.chip.chong { background: transparent; border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); color: var(--danger); }
.chip.gold { background: var(--gold-soft); color: var(--gold-ink); }
.field { width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.field:hover { border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); }
.field[aria-invalid="true"] { border-color: var(--danger); }
select.field { padding-right: 28px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 20px; border-radius: 999px; color: var(--ink-2); font-size: 15px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-accent); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 14.5px; }
.check input { appearance: none; width: 19px; height: 19px; border-radius: 4px; border: 1.5px solid var(--dim); margin: 0; display: grid; place-items: center; cursor: pointer; background: var(--card); flex: none; }
.check input:checked { background: var(--gold); border-color: var(--gold); }
.check input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--on-accent); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.switch input { appearance: none; width: 44px; height: 24px; border-radius: 999px; background: var(--scroll); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #FFF; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch input:checked { background: var(--gold); }
.switch input:checked::after { transform: translateX(20px); }
.empty { padding: 36px 22px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty p { color: var(--ink-2); max-width: 36em; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--bar); color: var(--bar-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
.modal { position: fixed; inset: 0; z-index: 70; background: color-mix(in srgb, #000 45%, transparent); display: grid; place-items: center; padding: 16px; }
.modal-card { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border-radius: var(--r); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.modal-card textarea { width: 100%; min-height: 260px; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 16px; background: var(--card-2); font-family: var(--f-sans); font-size: 13px; resize: vertical; }
.modal-acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 16px; }

/* ---------- 起卦頁 ---------- */
.form { display: flex; flex-direction: column; gap: 18px; }
.form-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 16px; align-items: start; }
@media (max-width: 1099px) { .form-wrap { grid-template-columns: minmax(0, 1fr); } }
.method-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.frow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: center; }
.frow > label, .frow > .flabel { color: var(--ink-2); font-size: 14.5px; }
.fgroup { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; }
.fgroup select.field { width: auto; min-width: 0; flex: 1 1 74px; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.nums label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--dim); min-width: 0; }
.nums input { text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.steps { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 10px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line-2); font-size: 13.5px; color: var(--ink-2); min-height: 88px; }
.steps .st { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.steps .st b { color: var(--ink); font-weight: 600; }
.steps .st .res { font-family: var(--f-serif); font-weight: 700; color: var(--gold-ink); white-space: nowrap; }
.steps .err { color: var(--danger); }
.picker { display: flex; flex-direction: column; gap: 6px; }
.pick-row { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) 52px; gap: 10px; align-items: center; }
.pick-row .pl { color: var(--dim); font-size: 13px; }
.pick-btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pick-btns button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; padding: 2px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; color: var(--ink-2); }
.pick-btns button .sym { font-size: 15px; color: var(--ink); letter-spacing: 0; }
.pick-btns button:hover { border-color: var(--gold); }
.pick-btns button[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.pick-btns button[aria-pressed="true"] .sym { color: var(--gold-ink); }
.pick-row .mini { justify-self: end; }
.picker-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.checks { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; }
.datebox { display: flex; flex-direction: column; gap: 12px; }
.drow { display: flex; flex-direction: column; gap: 6px; }
.drow .flabel { font-size: 13px; color: var(--dim); }
.dsel select.field { flex: 1 1 82px; min-width: 82px; padding: 8px 24px 8px 10px; }
.dsel #f-y { flex: 1.25 1 104px; min-width: 104px; }
.dsel .btn { flex: none; min-height: 42px; }
.gobar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 320px); gap: 14px 18px; align-items: center; padding: 14px 16px; }
@media (max-width: 760px) { .gobar { grid-template-columns: minmax(0, 1fr); } }
.preview { padding: 14px 16px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.pv-gz { font-family: var(--f-serif); font-size: 22px; font-weight: 700; letter-spacing: .1em; color: var(--ink); }
.pv-kv { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 2px 10px; }
.pv-kv .k { color: var(--dim); }
.pv-gua { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--gold); background: var(--gold-softer); min-height: 64px; }
.pv-one { display: inline-flex; align-items: center; gap: 10px; }
.pv-gua .nm { font-family: var(--f-serif); font-size: 20px; font-weight: 700; color: var(--gold-ink); }
.pv-gua .arrow { color: var(--dim); }
.gobtn { width: 100%; min-height: 54px; font-size: 18px; border-radius: 999px; }
.gobtn:not(:disabled) { color: var(--bar-ink); }

/* ---------- 爻畫 ---------- */
.yao { display: inline-flex; gap: 7px; width: 48px; height: 9px; vertical-align: middle; flex: none; }
.yao i { flex: 1 1 0; border-radius: 2px; background: var(--ink); }
.yao.mv i { background: var(--gold); }
.yao.sm { width: 30px; height: 6px; gap: 5px; }
.gua-mini { display: inline-flex; flex-direction: column-reverse; gap: 4px; vertical-align: middle; }
.gua-mini .yao { width: 34px; height: 6px; gap: 5px; }

/* ---------- 抬頭帶 ---------- */
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 18px; align-items: center; padding: 16px 20px; border-radius: var(--r); color: var(--bar-ink); background: radial-gradient(120% 140% at 0% 0%, var(--bar-2) 0%, var(--bar) 60%); border: 1px solid color-mix(in srgb, var(--bar-ink) 12%, var(--bar)); box-shadow: var(--shadow); }
.hbar-gua { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; min-width: 0; }
.hg { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hg .gua-mini .yao i { background: var(--bar-ink); }
.hg .gua-mini .yao.mv i { background: var(--bar-accent); }
.hg-name { font-family: var(--f-serif); font-size: 24px; font-weight: 700; color: var(--bar-accent); letter-spacing: .04em; line-height: 1.2; }
.hg-sub { font-size: 12.5px; color: var(--bar-dim); }
.hg-arrow { color: var(--bar-dim); font-size: 20px; }
.hbar-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--bar-ink); }
.hbar-meta .k { color: var(--bar-dim); margin-right: 4px; }
.hbar-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hbtn { min-height: 34px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--bar-accent); background: transparent; color: var(--bar-accent); font-size: 14px; white-space: nowrap; }
.hbtn:hover { background: color-mix(in srgb, var(--bar-accent) 16%, transparent); }
.hbar .q { grid-column: 1 / -1; font-size: 14px; color: var(--bar-ink); }
.hbar .q .k { color: var(--bar-dim); margin-right: 8px; }
@media (max-width: 899px) {
  .hbar { grid-template-columns: minmax(0, 1fr); padding: 14px 16px; }
  .hbar-acts { justify-content: flex-start; }
  .hg-name { font-size: 20px; }
}

/* ---------- 排盤表 ---------- */
.chart-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1320px) { .chart-grid { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); } .chart-grid .pan-card { position: sticky; top: 20px; } }
.pan { display: flex; flex-direction: column; }
.pan-head, .pan-row { display: grid; grid-template-columns: 2.6em 6.6em minmax(7.6em, 1fr) 76px minmax(7.6em, 1fr); grid-template-areas: "shen fu ben yao bian" "tags tags tags tags tags"; column-gap: 10px; align-items: center; }
.pan-head { padding: 10px 16px; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line); }
.pan-head .h-bian, .pan-head .h-ben { font-family: var(--f-serif); font-size: 14px; color: var(--ink-2); font-weight: 700; }
.pan-row { padding: 10px 16px; border-bottom: 1px solid var(--line-2); cursor: pointer; row-gap: 6px; position: relative; }
.pan-row:last-child { border-bottom: 0; }
.pan-row:hover { background: var(--gold-softer); }
.pan-row.is-focus { background: var(--gold-soft); }
.pan-row.is-mark { box-shadow: inset 3px 0 0 var(--gold); }
.c-shen { grid-area: shen; font-size: 13px; color: var(--ink-2); }
.c-fu { grid-area: fu; font-size: 12.5px; color: var(--dim); line-height: 1.35; }
.c-fu b { font-weight: 600; color: var(--ink-2); }

/* 三爻卦編碼：初爻＝1、二爻＝2、三爻＝4，陽爻為 1 */
const TRI_NAME = ["坤", "震", "坎", "兌", "艮", "離", "巽", "乾"];
const TRI_XIANG = ["地", "雷", "水", "澤", "山", "火", "風", "天"];
const TRI_WX = [2, 0, 4, 3, 2, 1, 0, 3];
const TRI_XT = [8, 4, 6, 2, 7, 3, 5, 1];               // 先天數
const XT_TRI = [null, 7, 3, 5, 1, 6, 2, 4, 0];
const TRI_BY_NAME = Object.fromEntries(TRI_NAME.map((n, i) => [n, i]));
/* 納甲（《增刪卜易·渾天甲子章》）：[內卦天干, 內卦三支, 外卦天干, 外卦三支] */
const NAJIA = [
  [1, [7, 5, 3], 9, [1, 11, 9]],    // 坤 乙未 乙巳 乙卯／癸丑 癸亥 癸酉
  [6, [0, 2, 4], 6, [6, 8, 10]],    // 震 庚子 庚寅 庚辰／庚午 庚申 庚戌
  [4, [2, 4, 6], 4, [8, 10, 0]],    // 坎 戊寅 戊辰 戊午／戊申 戊戌 戊子
  [3, [5, 3, 1], 3, [11, 9, 7]],    // 兌 丁巳 丁卯 丁丑／丁亥 丁酉 丁未
  [2, [4, 6, 8], 2, [10, 0, 2]],    // 艮 丙辰 丙午 丙申／丙戌 丙子 丙寅
  [5, [3, 1, 11], 5, [9, 7, 5]],    // 離 己卯 己丑 己亥／己酉 己未 己巳
  [7, [1, 11, 9], 7, [7, 5, 3]],    // 巽 辛丑 辛亥 辛酉／辛未 辛巳 辛卯
  [0, [0, 2, 4], 8, [6, 8, 10]]     // 乾 甲子 甲寅 甲辰／壬午 壬申 壬戌
];
/* 文王卦序：上卦、下卦 */
const KW_PAIRS = "乾乾 坤坤 坎震 艮坎 坎乾 乾坎 坤坎 坎坤 巽乾 乾兌 坤乾 乾坤 乾離 離乾 坤艮 震坤 兌震 艮巽 坤兌 巽坤 離震 艮離 艮坤 坤震 乾震 艮乾 艮震 兌巽 坎坎 離離 兌艮 震巽 乾艮 震乾 離坤 坤離 巽離 離兌 坎艮 震坎 艮兌 巽震 兌乾 乾巽 兌坤 坤巽 兌坎 坎巽 兌離 離巽 震震 艮艮 巽艮 震兌 震離 離艮 巽巽 兌兌 巽坎 坎兌 巽兌 震艮 坎離 離坎".split(" ");
const KW_NAMES = "乾 坤 屯 蒙 需 訟 師 比 小畜 履 泰 否 同人 大有 謙 豫 隨 蠱 臨 觀 噬嗑 賁 剝 復 无妄 大畜 頤 大過 坎 離 咸 恆 遯 大壯 晉 明夷 家人 睽 蹇 解 損 益 夬 姤 萃 升 困 井 革 鼎 震 艮 漸 歸妹 豐 旅 巽 兌 渙 節 中孚 小過 既濟 未濟".split(" ");
const KW_OF_BITS = new Array(64);
const BITS_OF_KW = new Array(65);
KW_PAIRS.forEach((p, i) => {
  const up = TRI_BY_NAME[p[0]], lo = TRI_BY_NAME[p[1]];
  const bits = lo | (up << 3);
  KW_OF_BITS[bits] = i + 1; BITS_OF_KW[i + 1] = bits;
});
const lowerOf = bits => bits & 7, upperOf = bits => bits >> 3;
function fullName(bits) {
  const up = upperOf(bits), lo = lowerOf(bits), n = KW_NAMES[KW_OF_BITS[bits] - 1];
  if (up === lo) return `${TRI_NAME[up]}為${TRI_XIANG[up]}`;
  return TRI_XIANG[up] + TRI_XIANG[lo] + n;
}
/* 八宮（京房）：乾 坎 艮 震 巽 離 坤 兌；本宮→一世…五世→遊魂→歸魂 */
const PALACE_ORDER = [7, 2, 4, 1, 6, 5, 0, 3];
const GEN_NAMES = ["八純", "一世", "二世", "三世", "四世", "五世", "遊魂", "歸魂"];
const GEN_SHI = [6, 1, 2, 3, 4, 5, 4, 3];
const PALACE_OF = new Array(64);
for (const t of PALACE_ORDER) {
  const seq = [];
  let h = t | (t << 3); seq.push(h);
  h ^= 1; seq.push(h); h ^= 2; seq.push(h); h ^= 4; seq.push(h); h ^= 8; seq.push(h); h ^= 16; seq.push(h);
  h ^= 8; seq.push(h);
  seq.push((h & 56) | t);
  seq.forEach((b, gen) => { PALACE_OF[b] = { palace: t, gen, shi: GEN_SHI[gen], ying: mod(GEN_SHI[gen] + 2, 6) + 1 }; });
}
/* 一卦六爻的納甲 */
function najiaOf(bits) {
  const lo = NAJIA[lowerOf(bits)], up = NAJIA[upperOf(bits)];
  const out = [];
  for (let k = 0; k < 3; k++) out.push({ g: lo[0], b: lo[1][k] });
  for (let k = 0; k < 3; k++) out.push({ g: up[2], b: up[3][k] });
  return out;
}
const LIUQIN = ["兄弟", "子孫", "妻財", "官鬼", "父母"];       // (爻五行 − 我) mod 5
const liuqinOf = (meWx, wx) => LIUQIN[mod(wx - meWx, 5)];
const LIUSHEN = ["青龍", "朱雀", "勾陳", "螣蛇", "白虎", "玄武"];
const LIUSHEN_START = [0, 0, 1, 1, 2, 3, 4, 4, 5, 5];        // 甲乙青龍、丙丁朱雀、戊勾陳、己螣蛇、庚辛白虎、壬癸玄武
/* 六沖卦、六合卦：初四、二五、三上三對地支皆沖（合） */
function pairKind(bits) {
  const L = najiaOf(bits);
  if ([0, 1, 2].every(k => isChong(L[k].b, L[k + 3].b))) return "六沖";
  if ([0, 1, 2].every(k => isHe(L[k].b, L[k + 3].b))) return "六合";
  return null;
}
function hexInfo(bits) {
  const kw = KW_OF_BITS[bits], pal = PALACE_OF[bits];
  return {
    bits, kw, name: KW_NAMES[kw - 1], full: fullName(bits), upper: upperOf(bits), lower: lowerOf(bits),
    palace: pal.palace, palaceName: TRI_NAME[pal.palace], palaceWx: TRI_WX[pal.palace], gen: pal.gen, genName: GEN_NAMES[pal.gen],
    shi: pal.shi, ying: pal.ying, pair: pairKind(bits), najia: najiaOf(bits)
  };
}
/* 爻名：初九、六二…上六 */
const POS_NAME = ["初", "二", "三", "四", "五", "上"];
function yaoName(pos, yang) { const n = yang ? "九" : "六"; return pos === 0 ? "初" + n : pos === 5 ? "上" + n : n + POS_NAME[pos]; }
const POS_SHORT = ["初爻", "二爻", "三爻", "四爻", "五爻", "上爻"];

/* ---------------- 3. 起卦 ---------------- */
/* 爻值：6 老陰（動）、7 少陽、8 少陰、9 老陽（動） */
const isYang = v => v === 7 || v === 9;
const isMoving = v => v === 6 || v === 9;
const YAO_LABEL = { 6: "老陰", 7: "少陽", 8: "少陰", 9: "老陽" };
function bigMod(str, n) {                         // 大整數取餘，餘 0 取 n
  const v = BigInt(str) % BigInt(n);
  return v === 0n ? n : Number(v);
}
function validNum(s) { return typeof s === "string" ? /^\d{1,60}$/.test(s.trim()) && BigInt(s.trim()) > 0n : Number.isInteger(s) && s > 0; }
/* 數字起卦：第一數上卦、第二數下卦，三數之和除 6 取動爻（餘 0 取上爻） */
function castNumbers(a, b, c) {
  const s = [a, b, c].map(x => String(x).trim());
  if (!s.every(validNum)) return { error: "請填三個正整數" };
  const up = bigMod(s[0], 8), lo = bigMod(s[1], 8);
  const sum = (BigInt(s[0]) + BigInt(s[1]) + BigInt(s[2])).toString();
  const mv = bigMod(sum, 6);
  return linesFrom(XT_TRI[up], XT_TRI[lo], [mv], {
    method: "number", nums: s, steps: [
      { label: "上卦", expr: `${s[0]} ÷ 8`, rem: up % 8, use: up, tri: XT_TRI[up] },
      { label: "下卦", expr: `${s[1]} ÷ 8`, rem: lo % 8, use: lo, tri: XT_TRI[lo] },
      { label: "動爻", expr: `(${s[0]} + ${s[1]} + ${s[2]}) = ${sum} ÷ 6`, rem: mv % 6, use: mv }
    ]
  });
}
function linesFrom(upTri, loTri, movingPositions, detail) {
  const bits = loTri | (upTri << 3);
  const lines = [];
  for (let k = 0; k < 6; k++) {
    const yang = (bits >> k) & 1, mv = movingPositions.includes(k + 1);
    lines.push(yang ? (mv ? 9 : 7) : (mv ? 6 : 8));
  }
  return { lines, detail };
}
/* 時間起卦（梅花易數）：(年支數＋農曆月＋農曆日)÷8 上卦；再加時支數 ÷8 下卦；總數 ÷6 動爻。
   年取農曆年地支；閏月以本月數計；時支數子=1…亥=12。 */
function castTime(mom) {
  const L = mom.lunar;
  if (!L) return { error: "這一天查不到農曆" };
  const yb = mod(L.year - 4, 12);                       // 農曆年地支（1984 甲子）
  const Y = yb + 1, M = L.month, D = L.day, H = mom.hourBranch + 1;
  const s1 = Y + M + D, s2 = s1 + H;
  const up = mod(s1 - 1, 8) + 1, lo = mod(s2 - 1, 8) + 1, mv = mod(s2 - 1, 6) + 1;
  return linesFrom(XT_TRI[up], XT_TRI[lo], [mv], {
    method: "time", Y, M, D, H, yb, leap: L.leap, steps: [
      { label: "上卦", expr: `年${ZHI[yb]}${Y} + ${L.leap ? "閏" : ""}${M}月 + ${D}日 = ${s1} ÷ 8`, rem: s1 % 8, use: up, tri: XT_TRI[up] },
      { label: "下卦", expr: `${s1} + ${ZHI[mom.hourBranch]}時${H} = ${s2} ÷ 8`, rem: s2 % 8, use: lo, tri: XT_TRI[lo] },
      { label: "動爻", expr: `${s2} ÷ 6`, rem: s2 % 6, use: mv }
    ]
  });
}
function castManual(values) {
  if (!Array.isArray(values) || values.length !== 6 || !values.every(v => [6, 7, 8, 9].includes(v))) return { error: "六個爻都要選" };
  return { lines: values.slice(), detail: { method: "manual" } };
}

/* ---------------- 4. 時間 ---------------- */
/* inp = { y, m, d, hh, mi, tz（小時）, zishi: 'day23'（23 點換日）| 'split'（夜子時不換日） } */
function moment(inp) {
  const tz = +inp.tz;
  const civil = { y: inp.y, m: inp.m, d: inp.d, hh: inp.hh || 0, mi: inp.mi || 0, ss: 0 };
  const jdLocal = C.clockToJD(civil);
  const jdUT = jdLocal - tz / 24;
  const clock = C.jdToClock(jdLocal);
  const solarYear = C.solarYearOf(jdUT);
  const yi = C.yearGZ(solarYear);
  const { prev: prevJie, next: nextJie } = C.jieAround(jdUT);
  const mb = prevJie.branch;
  const mi = C.monthGZ(yi, mb);
  const hb = C.hourBranchOf(clock.hh);
  let dayNum = clock.dayNum, hourDay = clock.dayNum;
  const zishi = inp.zishi === "split" ? "split" : "day23";
  if (clock.hh >= 23) { if (zishi === "day23") { dayNum += 1; hourDay = dayNum; } else hourDay = dayNum + 1; }
  const di = C.dayGZ(dayNum), hi = C.hourGZ(C.dayGZ(hourDay), hb);
  const lunar = C.lunarOfDay(dayNum);
  const term = C.termAround(jdUT);
  return {
    input: Object.assign({}, inp), tz, zishi, jdUT, clock, dayNum, solarYear,
    pillars: [yi, mi, di, hi], yearIdx: yi, monthIdx: mi, dayIdx: di, hourIdx: hi,
    monthBranch: mb, dayBranch: di % 12, dayStem: di % 10, hourBranch: hb,
    xunkong: C.xunKong(di), lunar, prevJie, nextJie, prevTerm: term.prev, nextTerm: term.next,
    lateZi: clock.hh >= 23
  };
}

/* ---------------- 5. 旺衰 ---------------- */
/* 月令（《增刪卜易·四時旺相章》《月將章》）：臨月建、同類為旺，月生為相；月沖為月破、月合為月合 */
function monthState(mb, b) {
  const mw = zhiWx(mb), w = zhiWx(b);
  if (b === mb) return { key: "lin", text: "臨月建", wang: true };
  if (isChong(mb, b)) return { key: "po", text: "月破", wang: false };
  if (isHe(mb, b)) return { key: "he", text: "月合", wang: true };
  const r = wxRel(mw, w);
  if (r === "same") return { key: "fu", text: "旺", wang: true };
  if (r === "sheng") return { key: "xiang", text: "相", wang: true };
  if (r === "besheng") return { key: "xiu", text: "休", wang: false, yuqi: (mb === 7 && w === 1) || (mb === 1 && w === 4) };
  if (r === "beike") return { key: "qiu", text: "囚", wang: false };
  return { key: "si", text: "死", wang: false };            // 月剋爻
}
const MONTH_F = { lin: 1.0, fu: 0.95, xiang: 0.85, he: 0.85, xiu: 0.6, qiu: 0.55, si: 0.5, po: 0.4 };
function dayRel(db, b) {
  const dw = zhiWx(db), w = zhiWx(b);
  if (b === db) return "lin";
  if (isChong(db, b)) return "chong";
  if (isHe(db, b)) return "he";
  const r = wxRel(dw, w);
  return { same: "fu", sheng: "sheng", ke: "ke", beike: "hao", besheng: "xie" }[r];
}

/* ---------------- 6. 排盤 ---------------- */
function build(cast, mom) {
  const vals = cast.lines;
  let bits = 0, cbits = 0;
  const moving = [];
  vals.forEach((v, k) => {
    if (isYang(v)) bits |= 1 << k;
    if (isMoving(v)) moving.push(k);
  });
  cbits = bits; for (const k of moving) cbits ^= 1 << k;
  const ben = hexInfo(bits), bian = moving.length ? hexInfo(cbits) : null;
  const meWx = ben.palaceWx;
  const mb = mom.monthBranch, db = mom.dayBranch, kong = mom.xunkong;
  const shenStart = LIUSHEN_START[mom.dayStem];
  const lines = ben.najia.map((nj, k) => {
    const yang = isYang(vals[k]), mv = isMoving(vals[k]);
    const wx = zhiWx(nj.b);
    const L = {
      pos: k, posName: POS_SHORT[k], yaoName: yaoName(k, yang), value: vals[k], yang, moving: mv,
      g: nj.g, b: nj.b, wx, qin: liuqinOf(meWx, wx), shen: LIUSHEN[(shenStart + k) % 6],
      shi: ben.shi === k + 1, ying: ben.ying === k + 1,
      kong: kong.includes(nj.b), month: monthState(mb, nj.b), day: dayRel(db, nj.b),
      dayStage: csStage(wx, db)
    };
    if (mv) {
      const cn = bian.najia[k];
      const cwx = zhiWx(cn.b);
      L.change = {
        pos: k, g: cn.g, b: cn.b, wx: cwx, qin: liuqinOf(meWx, cwx), yang: !yang,
        kong: kong.includes(cn.b), month: monthState(mb, cn.b), day: dayRel(db, cn.b), dayStage: csStage(cwx, db)
      };
    }
    return L;
  });
  /* 伏神：本卦缺的六親，取本宮首卦同一六親所在之爻，伏於本卦同位之下（《火珠林》：本宮之六親在飛象之下為伏神） */
  const present = new Set(lines.map(l => l.qin));
  const shou = hexInfo(ben.palace | (ben.palace << 3));
  const fu = [];
  shou.najia.forEach((nj, k) => {
    const wx = zhiWx(nj.b), q = liuqinOf(meWx, wx);
    if (!present.has(q)) {
      const F = { pos: k, g: nj.g, b: nj.b, wx, qin: q, kong: kong.includes(nj.b), month: monthState(mb, nj.b), day: dayRel(db, nj.b), dayStage: csStage(wx, db) };
      F.fei = lines[k];
      lines[k].fu = F;
      fu.push(F);
    }
  });
  /* 爻的動態（《增刪卜易·暗動章》《動散章》《六合章》）：
     靜爻旺相逢日沖為暗動、休囚為日破；旬空逢日沖為沖空則實（旺相者兼作暗動）；
     動爻逢日沖，旺相不散、休囚恐散；靜而逢日合為合起，動而逢日合為合絆 */
  for (const L of lines) {
    L.wang = L.month.wang;                                         // 旺相休囚以月令定
    if (L.day === "chong") {
      if (L.moving) L.dayChong = L.wang ? "notsan" : "san";
      else if (L.kong) { L.dayChong = "kongshi"; L.andong = L.wang; }
      else if (L.wang) { L.dayChong = "andong"; L.andong = true; }
      else { L.dayChong = "ripo"; L.ripo = true; }
    }
    if (L.day === "he") L.dayHe = L.moving ? "ban" : "qi";
  }
  /* 動變 */
  for (const L of lines) if (L.moving) L.hua = huaOf(L, mom);
  const out = { cast, mom, ben, bian, shou, lines, fu, moving, meWx };
  out.lineForce = lines.map(L => lineForce(L));
  out.relations = relations(out);
  out.summary = summarize(out);
  return out;
}

/* 動爻化出的關係：回頭生剋沖合、進退、生旺墓絕、化空、化破、伏吟 */
function huaOf(L, mom) {
  const c = L.change, res = [];
  const r = wxRel(c.wx, L.wx);                       // 變爻對動爻
  if (c.b === L.b) res.push({ key: "fuyin", text: "化伏吟", note: "變爻與動爻同支" });
  if (isChong(c.b, L.b)) res.push({ key: "chong", text: "回頭沖", note: "變爻沖本位，爻之反吟" });
  if (isHe(c.b, L.b)) res.push({ key: "he", text: "回頭合", note: "爻動化出之爻回頭相合，謂之化扶" });
  if (JIN[L.b] === c.b) res.push({ key: "jin", text: "化進神" });
  if (TUI[L.b] === c.b) res.push({ key: "tui", text: "化退神" });
  if (r === "sheng") res.push({ key: "sheng", text: "回頭生" });
  if (r === "ke") res.push({ key: "ke", text: "回頭剋" });
  if (r === "besheng") res.push({ key: "xie", text: "化洩", note: "動爻生變爻" });
  if (r === "beike") res.push({ key: "hao", text: "化耗", note: "動爻剋變爻" });
  if (r === "same" && c.b !== L.b && JIN[L.b] !== c.b && TUI[L.b] !== c.b) res.push({ key: "bihe", text: "化比和" });
  const st = csStage(L.wx, c.b);
  if (st === "長生") res.push({ key: "zhangsheng", text: "化長生" });
  if (st === "帝旺") res.push({ key: "diwang", text: "化帝旺" });
  if (st === "墓") res.push({ key: "mu", text: "化墓" });
  if (st === "絕") res.push({ key: "jue", text: "化絕" });
  if (c.kong) res.push({ key: "kong", text: "化空" });
  if (isChong(mom.monthBranch, c.b)) res.push({ key: "po", text: "化破" });
  return res;
}
const hasHua = (L, k) => L.hua && L.hua.some(h => h.key === k);

/* 動爻或暗動爻作為施力者的力量係數（0.2–1.2） */
function lineForce(L) {
  let f = MONTH_F[L.month.key];
  if (L.day === "lin") f += 0.15; else if (L.day === "sheng") f += 0.1; else if (L.day === "fu") f += 0.05; else if (L.day === "ke") f -= 0.15;
  if (L.moving) {
    if (L.dayHe === "ban") f *= 0.6;
    if (L.dayChong === "san") f *= 0.7;
    if (hasHua(L, "ke")) f *= 0.6;
    if (hasHua(L, "chong")) f *= 0.75;
    if (hasHua(L, "tui")) f *= 0.8;
    if (hasHua(L, "po")) f *= 0.7;
    if (hasHua(L, "kong")) f *= 0.8;
    if (hasHua(L, "jue") || hasHua(L, "mu")) f *= 0.8;
    if (hasHua(L, "sheng") || hasHua(L, "jin")) f *= 1.1;
  }
  return Math.max(0.2, Math.min(1.2, f));
}

/* ---------------- 7. 關係清單 ---------------- */
/* group: 'hc' 合沖、'sk' 生剋、'kong' 旬空。score 0–100 為力量，排序用。 */
const wxN = w => WX[w];
const bName = b => ZHI[b] + WX[zhiWx(b)];
function who(L) {
  const t = [];
  if (L.shi) t.push("世"); if (L.ying) t.push("應");
  return `${L.posName}${GAN[L.g]}${bName(L.b)}${L.qin}${t.length ? "（" + t.join("、") + "）" : ""}`;
}

        return tri.includes(L.pos) && slots.every(s => s === missing || s.mv.some(x => x.moving && tri.includes(x.pos)));
      });
      if (byChange) { status = "成局"; how = "同一卦內兩爻動，變出之爻補足"; }
      else { status = "待用"; how = "兩爻動，缺一待補（虛一待用）"; }
    } else if (movingCount >= 1 && present === 3) { status = "未成"; how = "三支俱在而只一爻動"; }
    if (!status) continue;
    const members = slots.map(s => {
      const L = s.mv[0] || s.st[0] || s.ch[0];
      if (!L) return `${ZHI[s.b]}（缺）`;
      const src = s.mv[0] ? (s.mv[0].moving ? "動" : "暗動") : s.st[0] ? "靜" : "變";
      return `${ZHI[s.b]}（${L.posName}${src}）`;
    }).join("、");
    const flaw = status !== "未成" && slots.some(s => [...s.mv, ...s.st].some(L => L.kong || L.month.key === "po")) ? "；局中有爻空破，待填實之日成之" : "";
    add({ group: "hc", type: "三合", actor: "G", target: `${g.m.map(b => ZHI[b]).join("")}${WX[g.wx]}局`, kind: "gua",
      score: status === "成局" ? 84 : status === "待用" ? 46 : 20,
      title: `${g.m.map(b => ZHI[b]).join("")}合${WX[g.wx]}局`, verdict: status, note: `${how}：${members}${flaw}` });
  }
  /* 7.9 旬空（《增刪卜易·旬空章》：旺不為空、動不為空、有日建動爻生扶不為空；月破亦空；春土夏金秋木冬火為真空） */
  const ZHENKONG = { 2: 2, 5: 2, 1: 3, 4: 3, 7: 0, 10: 0 };   // 寅卯月土、巳午月金…（以月令剋爻判「死」）
  const kongItem = (T, label, kind, moving, base) => {
    if (!T.kong) return;
    let verdict, s;
    const help = T.day === "sheng" || T.day === "fu" || lines.some(A => (A.moving || A.andong) && A !== T && (wxRel(A.wx, T.wx) === "sheng" || A.b === T.b));
    if (moving) { verdict = "動不為空"; s = 40; }
    else if (T.day === "chong") { verdict = "沖空則實"; s = 52; }
    else if (T.month.key === "po") { verdict = "空又逢破"; s = 86; }
    else if (T.month.key === "si") { verdict = "真空"; s = 84; }
    else if (T.month.wang) { verdict = "旺而逢空，出旬可用"; s = 56; }
    else if (help) { verdict = "有生扶，不為真空"; s = 60; }
    else { verdict = "旬空"; s = 72; }
    add({ group: "kong", type: "旬空", actor: "K", target: label, kind, pos: T.pos, score: base * s / 100, title: `${label}落旬空（${mom.xunkong.map(b => ZHI[b]).join("")}）`, verdict, note: "旬內為空，出旬或逢沖、逢值則實" });
  };
  for (const L of lines) {
    kongItem(L, who(L), "line", L.moving, 100);
    if (L.fu) kongItem(L.fu, whoFu(L.fu), "fu", false, 80);
  }
  /* 排序：同分時合沖先於生剋 */
  const GO = { hc: 0, sk: 1, kong: 2 };
  R.sort((a, b) => b.score - a.score || GO[a.group] - GO[b.group]);
  R.forEach((r, i) => { r.id = i; });
  return R;
}

/* ---------------- 8. 摘要（給表格標籤用） ---------------- */
function summarize(ch) {

    if (L.month.key === "lin") tags.push({ t: "臨月建", k: "good" });
    if (L.month.key === "po") tags.push({ t: L.day === "lin" ? "月破（臨日不破）" : "月破", k: "bad" });
    if (L.month.key === "he") tags.push({ t: "月合", k: "good" });
    if (L.day === "lin") tags.push({ t: "臨日", k: "good" });
    if (L.day === "chong") {
      if (!L.moving) tags.push(L.kong ? { t: "沖空則實", k: "note" } : L.wang ? { t: "暗動", k: "warn" } : { t: "日破", k: "bad" });
      else tags.push(L.dayChong === "san" ? { t: "日沖（恐散）", k: "bad" } : { t: "日沖（不散）", k: "note" });
      tags.push({ t: "日沖", k: "chong" });
    }
    if (L.day === "he") tags.push(L.moving ? { t: "合絆", k: "warn" } : { t: "合起", k: "good" });
    if (L.kong) tags.push({ t: L.moving ? "旬空（動不為空）" : "旬空", k: "kong" });
    if (L.dayStage) tags.push({ t: { 長生: "長生於日", 帝旺: "帝旺於日", 墓: "入日墓", 絕: "絕於日" }[L.dayStage], k: "note" });
    const hua = (L.hua || []).map(h => ({ t: h.text, k: ["ke", "chong", "tui", "kong", "po", "jue", "mu"].includes(h.key) ? "bad" : ["sheng", "jin", "he", "zhangsheng", "diwang"].includes(h.key) ? "good" : "note" }));
    return { tags, hua };
  });
}

const ZHOUYI = [{"n":"乾","g":"元亨，利貞。","lab":["初九","九二","九三","九四","九五","上九"],"y":["潛龍，勿用。","見龍在田，利見大人。","君子終日乾乾，夕惕若，厲，无咎。","或躍在淵，无咎。","飛龍在天，利見大人。","亢龍有悔。"],"d":"天行健，君子以自強不息。","x":["潛龍勿用，陽在下也。","見龍在田，德施普也。","終日乾乾，反復道也。","或躍在淵，進无咎也。","飛龍在天，大人造也。","亢龍有悔，盈不可久也。"],"yy":"見群龍无首，吉。","yx":"用九，天德不可為首也。"},{"n":"坤","g":"元亨，利牝馬之貞。君子有攸往，先迷後得主，利西南得朋，東北喪朋。安貞，吉。","lab":["初六","六二","六三","六四","六五","上六"],"y":["履霜，堅冰至。","直，方，大，不習无不利。","含章可貞。或從王事，无成有終。","括囊；无咎，无譽。","黃裳，元吉。","龍戰于野，其血玄黃。"],"d":"地勢坤，君子以厚德載物。","x":["履霜堅冰，陰始凝也。馴致其道，至堅冰也。","六二之動，直以方也。不習无不利，地道光也。","含章可貞，以時發也。或從王事，知光大也。","括囊无咎，慎不害也。","黃裳元吉，文在中也。","龍戰于野，其道窮也。"],"yy":"利永貞。","yx":"用六永貞，以大終也。"},{"n":"屯","g":"元亨，利貞，勿用有攸往，利建侯。","lab":["初九","六二","六三","六四","九五","上六"],"y":["磐桓；利居貞，利建侯。","屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。","即鹿无虞，惟入于林中，君子幾不如舍，往吝。","乘馬班如，求婚媾，往吉，无不利。","屯其膏，小貞吉，大貞凶。","乘馬班如，泣血漣如。"],"d":"雲，雷，屯；君子以經綸。","x":["雖磐桓，志行正也。以貴下賤，大得民也。","六二之難，乘剛也。十年乃字，反常也。","即鹿无虞，以從禽也。君子舍之，往吝窮也。","求而往，明也。","屯其膏，施未光也。","泣血漣如，何可長也。"]},{"n":"蒙","g":"亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。","lab":["初六","九二","六三","六四","六五","上九"],"y":["發蒙，利用刑人，用說桎梏，以往吝。","包蒙吉；納婦吉；子克家。","勿用取女；見金夫，不有躬，无攸利。","困蒙，吝。","童蒙，吉。","擊蒙；不利為寇，利禦寇。"],"d":"山下出泉，蒙；君子以果行育德。","x":["利用刑人，以正法也。","子克家，剛柔〓也。","勿用取女，行不順也。","困蒙之吝，獨遠實也。","童蒙之吉，順以巽也。","利用禦寇，上下順也。"]},{"n":"需","g":"有孚，光亨，貞吉。利涉大川。","lab":["初九","九二","九三","六四","九五","上六"],"y":["需于郊。利用恆，无咎。","需于沙。小有言，終吉。","需于泥，致寇至。","需于血，出自穴。","需于酒食，貞吉。","入于穴，有不速之客三人來，敬之終吉。"],"d":"雲上於天，需；君子以飲食宴樂。","x":["需于郊，不犯難行也。利用恆，无咎，未失常也。","需于沙，衍在中也。雖小有言，以吉終也。","需于泥，災在外也。自我致寇，敬慎不敗也。","需于血，順以聽也。","酒食，貞吉，以中正也。","不速之客來，敬之終吉。雖不當位，未大失也。"]},{"n":"訟","g":"有孚，窒。惕中吉。終凶。利見大人，不利涉大川。","lab":["初六","九二","六三","九四","九五","上九"],"y":["不永所事，小有言，終吉。","不克訟，歸而逋，其邑人三百戶，无眚。","食舊德，貞厲，終吉，或從王事，无成。","不克訟，復即命渝，安貞吉。","訟元吉。","或錫之鞶帶，終朝三褫之。"],"d":"天與水違行，訟；君子以作事謀始。","x":["不永所事，訟不可長也。雖小有言，其辯明也。","不克訟，歸逋竄也。自下訟上，患至掇也。","食舊德，從上吉也。","復即命渝，安貞，不失也。","訟，元吉，以中正也。","以訟受服，亦不足敬也。"]},{"n":"師","g":"貞，丈人，吉无咎。","lab":["初六","九二","六三","六四","六五","上六"],"y":["師出以律，否臧凶。","在師中吉，无咎，王三錫命。","師或輿尸，凶。","師左次，无咎。","田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。","大君有命，開國承家，小人勿用。"],"d":"地中有水，師；君子以容民畜眾。","x":["師出以律；失律，凶也。","在師中吉，承天寵也。王三錫命，懷萬邦也。","師或輿尸，大无功也。","左次无咎，未失常也。","長子帥師，以中行也。弟子輿尸，使不當也。","大君有命，以正功也。小人勿用，必亂邦也。"]},{"n":"比","g":"吉。原筮元永貞，无咎。不寧方來，後夫凶。","lab":["初六","六二","六三","六四","九五","上六"],"y":["有孚，比之，无咎。有孚盈缶，終來有它吉。","比之自內，貞吉。","比之匪人。","外比之，貞吉。","顯比，王用三驅，失前禽。邑人不誡，吉。","比之无首，凶。"],"d":"地上有水，比；先王以建萬國，親諸侯。","x":["比之初六，有它吉也。","比之自內，不自失也。","比之匪人，不亦傷乎！","外比於賢，以從上也。","顯比之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。","比之无首，无所終也。"]},{"n":"小畜","g":"亨。密雲不雨，自我西郊。","lab":["初九","九二","九三","六四","九五","上九"],"y":["復自道，何其咎，吉。","牽復，吉。","輿說輻，夫妻反目。","有孚，血去惕出，无咎。","有孚攣如，富以其鄰。","既雨既處，尚德載，婦貞厲。月幾望，君子征凶。"],"d":"風行天上，小畜；君子以懿文德。","x":["復自道，其義吉也。","牽復在中，亦不自失也。","夫妻反目，不能正室也。","有孚。惕出。上合志也。","有孚攣如，不獨富也。","既雨既處，德積載也。君子征凶，有所疑也。"]},{"n":"履","g":"履虎尾，不咥人，亨。","lab":["初九","九二","六三","九四","九五","上九"],"y":["素履，往无咎。","履道坦坦，幽人貞吉。","眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。","履虎尾，愬愬，終吉。","夬履，貞厲。","視履考祥，其旋元吉。"],"d":"上天下澤，履；君子以辯上下，定民志。","x":["素履之往，獨行願也。","幽人貞吉，中不自亂也。","眇能視，不足以有明也。跛能履，不足以與行也。咥人之凶，位不當也。武人為于大君，志剛也。","愬愬終吉，志行也。","夬履貞厲，位正當也。","元吉在上，大有慶也。"]},{"n":"泰","g":"小往大來，吉亨。","lab":["初九","九二","九三","六四","六五","上六"],"y":["拔茅茹，以其彙，征吉。","包荒，用馮河，不遐遺，朋亡，得尚于中行。","无平不陂，无往不復，艱貞无咎。勿恤其孚，于食有福。","翩翩，不富，以其鄰，不戒以孚。","帝乙歸妹，以祉元吉。","城復于隍，勿用師。自邑告命，貞吝。"],"d":"天地交泰，后以財成天地之道，輔相天地之宜，以左右民。","x":["拔茅征吉，志在外也。","包荒，得尚于中行，以光大也。","无往不復，天地際也。","翩翩不富，皆失實也。不戒以孚，中心願也。","以祉，元吉。中以行願也。","城復于隍，其命亂也。"]},{"n":"否","g":"否之匪人，不利君子貞，大往小來。","lab":["初六","六二","六三","九四","九五","上九"],"y":["拔茅茹，以其彙，貞吉亨。","包承。小人吉，大人否，亨。","包羞。","有命，无咎，疇離祉。","休否，大人吉。其亡其亡，繫于苞桑。","傾否，先否後喜。"],"d":"天地不交，否；君子以儉德辟難，不可榮以祿。","x":["拔茅貞吉，志在君也。","大人否，亨。不亂群也。","包羞，位不當也。","有命无咎，志行也。","大人之吉，位正當也。","否終則傾，何可長也。"]},{"n":"同人","g":"同人于野，亨。利涉大川，利君子貞。","lab":["初九","六二","九三","九四","九五","上九"],"y":["同人于門，无咎。","同人于宗，吝。","伏戎于莽，升其高陵，三歲不興。","乘其墉，弗克攻，吉。","同人，先號咷而後笑。大師克相遇。","同人于郊，无悔。"],"d":"天與火，同人；君子以類族辨物。","x":["出門同人，又誰咎也。","同人于宗，吝道也。","伏戎于莽，敵剛也。三歲不興，安行也。","乘其墉，義弗克也，其吉，則困而反則也。","同人之先，以中直也。大師相遇，言相克也。","同人于郊，志未得也。"]},{"n":"大有","g":"元亨。","lab":["初九","九二","九三","九四","六五","上九"],"y":["无交害，匪咎，艱則无咎。","大車以載，有攸往，无咎。","公用亨于天子，小人弗克。","匪其彭，无咎。","厥孚交如，威如；吉。","自天祐之，吉无不利。"],"d":"火在天上，大有；君子以遏惡揚善，順天休命。","x":["大有初九，无交害也。","大車以載，積中不敗也。","公用亨于天子，小人害也。","匪其彭，无咎；明辨晳也。","厥孚交如，信以發志也。威如之吉，易而无備也。","大有上吉，自天祐也。"]},{"n":"謙","g":"亨，君子有終。","lab":["初六","六二","九三","六四","六五","上六"],"y":["謙謙君子，用涉大川，吉。","鳴謙，貞吉。","勞謙，君子有終，吉。","无不利，撝謙。","不富，以其鄰，利用侵伐，无不利。","鳴謙，利用行師，征邑國。"],"d":"地中有山，謙；君子以裒多益寡，稱物平施。","x":["謙謙君子，卑以自牧也。","鳴謙貞吉，中心得也。","勞謙君子，萬民服也。","无不利撝謙；不違則也。","利用侵伐，征不服也。","鳴謙，志未得也。可用行師，征邑國也。"]},{"n":"豫","g":"利建侯，行師。","lab":["初六","六二","六三","九四","六五","上六"],"y":["鳴豫，凶。","介于石，不終日，貞吉。","盱豫，悔。遲有悔。","由豫，大有得。勿疑。朋盍簪。","貞疾，恆不死。","冥豫，成有渝，无咎。"],"d":"雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。","x":["初六鳴豫，志窮凶也。","不終日，貞吉；以中正也。","盱豫有悔，位不當也。","由豫，大有得；志大行也。","六五貞疾，乘剛也。恆不死，中未亡也。","冥豫在上，何可長也。"]},{"n":"隨","g":"元亨利貞，无咎。","lab":["初九","六二","六三","九四","九五","上六"],"y":["官有渝，貞吉。出門交有功。","係小子，失丈夫。","係丈夫，失小子。隨有求得，利居貞。","隨有獲，貞凶。有孚在道，以明，何咎。","孚于嘉，吉。","拘係之，乃從維之。王用亨于西山。"],"d":"澤中有雷，隨；君子以嚮晦入宴息。","x":["官有渝，從正吉也。出門交有功，不失也。","係小子，弗兼與也。","係丈夫，志舍下也。","隨有獲，其義凶也。有孚在道，明功也。","孚于嘉，吉；位正中也。","拘係之，上窮也。"]},{"n":"蠱","g":"元亨，利涉大川。先甲三日，後甲三日。","lab":["初六","九二","九三","六四","六五","上九"],"y":["幹父之蠱，有子，考无咎，厲終吉。","幹母之蠱，不可貞。","幹父之蠱，小有悔，无大咎。","裕父之蠱，往見吝。","幹父之蠱，用譽。","不事王侯，高尚其事。"],"d":"山下有風，蠱；君子以振民育德。","x":["幹父之蠱，意承考也。","幹母之蠱，得中道也。","幹父之蠱，終无咎也。","裕父之蠱，往未得也。","幹父用譽，承以德也。","不事王侯，志可則也。"]},{"n":"臨","g":"元，亨，利，貞。至于八月有凶。","lab":["初九","九二","六三","六四","六五","上六"],"y":["咸臨，貞吉。","咸臨，吉无不利。","甘臨，无攸利。既憂之，无咎。","至臨，无咎。","知臨，大君之宜，吉。","敦臨，吉无咎。"],"d":"澤上有地，臨；君子以教思无窮，容保民无疆。","x":["咸臨貞吉，志行正也。","咸臨，吉无不利；未順命也。","甘臨，位不當也。既憂之，咎不長也。","至臨无咎，位當也。","大君之宜，行中之謂也。","敦臨之吉，志在內也。"]},{"n":"觀","g":"盥而不薦，有孚顒若。","lab":["初六","六二","六三","六四","九五","上九"],"y":["童觀，小人无咎，君子吝。","闚觀，利女貞。","觀我生，進退。","觀國之光，利用賓于王。","觀我生，君子无咎。","觀其生，君子无咎。"],"d":"風行地上，觀；先王以省方，觀民設教。","x":["初六童觀，小人道也。","闚觀女貞，亦可醜也。","觀我生，進退；未失道也。","觀國之光，尚賓也。","觀我生，觀民也。","觀其生，志未平也。"]},{"n":"噬嗑","g":"亨。利用獄。","lab":["初九","六二","六三","九四","六五","上九"],"y":["屨校滅趾，无咎。","噬膚滅鼻，无咎。","噬腊肉，遇毒；小吝，无咎。","噬乾胏，得金矢，利艱貞，吉。","噬乾肉，得黃金，貞厲，无咎。","何校滅耳，凶。"],"d":"雷電噬嗑；先王以明罰敕法。","x":["屨校滅趾，不行也。","噬膚滅鼻，乘剛也。","遇毒，位不當也。","利艱貞吉，未光也。","貞厲无咎，得當也。","何校滅耳，聰不明也。"]},{"n":"賁","g":"亨。小利有攸往。","lab":["初九","六二","九三","六四","六五","上九"],"y":["賁其趾，舍車而徒。","賁其須。","賁如濡如，永貞吉。","賁如皤如，白馬翰如，匪寇婚媾。","賁于丘園，束帛戔戔，吝，終吉。","白賁，无咎。"],"d":"山下有火，賁；君子以明庶政，无敢折獄。","x":["舍車而徒，義弗乘也。","賁其須，與上興也。","永貞之吉，終莫之陵也。","六四，當位疑也。匪寇婚媾，終无尤也。","六五之吉，有喜也。","白賁无咎，上得志也。"]},{"n":"剝","g":"不利有攸往。","lab":["初六","六二","六三","六四","六五","上九"],"y":["剝牀以足，蔑貞凶。","剝牀以辨，蔑貞凶。","剝之，无咎。","剝牀以膚，凶。","貫魚，以宮人寵，无不利。","碩果不食，君子得輿，小人剝廬。"],"d":"山附於地，剝；上以厚下，安宅。","x":["剝牀以足，以滅下也。","剝牀以辨，未有與也。","剝之无咎，失上下也。","剝牀以膚，切近災也。","以宮人寵，終无尤也。","君子得輿，民所載也。小人剝廬，終不可用也。"]},{"n":"復","g":"亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。","lab":["初九","六二","六三","六四","六五","上六"],"y":["不遠復，无祗悔，元吉。","休復，吉。","頻復，厲无咎。","中行獨復。","敦復，无悔。","迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至于十年，不克征。"],"d":"雷在地中，復；先王以至日閉關，商旅不行，后不省方。","x":["不遠之復，以脩身也。","休復之吉，以下仁也。","頻復之厲，義无咎也。","中行獨復，以從道也。","敦復无悔，中以自考也。","迷復之凶，反君道也。"]},{"n":"无妄","g":"元亨，利貞。其匪正有眚，不利有攸往。","lab":["初九","六二","六三","九四","九五","上九"],"y":["无妄，往吉。","不耕穫，不菑畬，則利有攸往。","无妄之災，或繫之牛，行人之得，邑人之災。","可貞，无咎。","无妄之疾，勿藥有喜。","无妄，行有眚，无攸利。"],"d":"天下雷行，物與无妄；先王以茂對時，育萬物。","x":["无妄之往，得志也。","不耕穫，未富也。","行人得牛，邑人災也。","可貞无咎，固有之也。","无妄之藥，不可試也。","无妄之行，窮之災也。"]},{"n":"大畜","g":"利貞，不家食吉，利涉大川。","lab":["初九","九二","九三","六四","六五","上九"],"y":["有厲利已。","輿說輹。","良馬逐，利艱貞。曰閑輿衛，利有攸往。","童牛之牿，元吉。","豶豕之牙，吉。","何天之衢，亨。"],"d":"天在山中，大畜；君子以多識前言往行，以畜其德。","x":["有厲利已，不犯災也。","輿說輹，中无尤也。","利有攸往，上合志也。","六四元吉，有喜也。","六五之吉，有慶也。","何天之衢，道大行也。"]},{"n":"頤","g":"貞吉。觀頤，自求口實。","lab":["初九","六二","六三","六四","六五","上九"],"y":["舍爾靈龜，觀我朵頤，凶。","顛頤，拂經，于丘頤，征凶。","拂頤，貞凶，十年勿用，无攸利。","顛頤，吉，虎視眈眈，其欲逐逐，无咎。","拂經，居貞吉，不可涉大川。","由頤，厲吉，利涉大川。"],"d":"山下有雷，頤；君子以慎言語，節飲食。","x":["觀我朵頤，亦不足貴也。","六二征凶，行失類也。","十年勿用，道大悖也。","顛頤之吉，上施光也。","居貞之吉，順以從上也。","由頤厲吉，大有慶也。"]},{"n":"大過","g":"棟橈，利有攸往，亨。","lab":["初六","九二","九三","九四","九五","上六"],"y":["藉用白茅，无咎。","枯楊生稊，老夫得其女妻，无不利。","棟橈，凶。","棟隆，吉；有它吝。","枯楊生華，老婦得其士夫，无咎无譽。","過涉滅頂，凶，无咎。"],"d":"澤滅木，大過；君子以獨立不懼，遯世无悶。","x":["藉用白茅，柔在下也。","老夫女妻，過以相與也。","棟橈之凶，不可以有輔也。","棟隆之吉，不橈乎下也。","枯楊生華，何可久也。老婦士夫，亦可醜也。","過涉之凶，不可咎也。"]},{"n":"坎","g":"習坎，有孚，維心亨，行有尚。","lab":["初六","九二","六三","六四","九五","上六"],"y":["習坎，入于坎窞，凶。","坎有險，求小得。","來之坎坎，險且枕，入于坎窞，勿用。","樽酒簋貳，用缶，納約自牖，終无咎。","坎不盈，祗既平，无咎。","係用徽纆，寘于叢棘，三歲不得，凶。"],"d":"水洊至，習坎；君子以常德行，習教事。","x":["習坎入坎，失道凶也。","求小得，未出中也。","來之坎坎，終无功也。","樽酒簋貳，剛柔際也。","坎不盈，中未大也。","上六失道，凶三歲也。"]},{"n":"離","g":"利貞，亨。畜牝牛，吉。","lab":["初九","六二","九三","九四","六五","上九"],"y":["履錯然，敬之无咎。","黃離，元吉。","日昃之離，不鼓缶而歌，則大耋之嗟，凶。","突如其來如，焚如，死如，棄如。","出涕沱若，戚嗟若，吉。","王用出征，有嘉折首，獲匪其醜，无咎。"],"d":"明兩作離，大人以繼明照于四方。","x":["履錯之敬，以辟咎也。","黃離元吉，得中道也。","日昃之離，何可久也。","突如其來如，无所容也。","六五之吉，離王公也。","王用出征，以正邦也。"]},{"n":"咸","g":"咸，亨，利貞，取女吉。","lab":["初六","六二","九三","九四","九五","上六"],"y":["咸其拇。","咸其腓，凶，居吉。","咸其股，執其隨，往吝。","貞吉，悔亡，憧憧往來，朋從爾思。","咸其脢，无悔。","咸其輔頰舌。"],"d":"山上有澤，咸，君子以虛受人。","x":["咸其拇，志在外也。","雖凶，居吉，順不害也。","咸其股，亦不處也。志在隨人，所執下也。","貞吉悔亡，未感害也。憧憧往來，未光大也。","咸其脢，志末也。","咸其輔，頰，舌，滕口說也。"]},{"n":"恆","g":"亨，无咎，利貞，利有攸往。","lab":["初六","九二","九三","九四","六五","上六"],"y":["浚恆，貞凶，无攸利。","悔亡。","不恆其德，或承之羞，貞吝。","田无禽。","恆其德，貞，婦人吉，夫子凶。","振恆，凶。"],"d":"雷風，恆；君子以立不易方。","x":["浚恆之凶，始求深也。","九二悔亡，能久中也。","不恆其德，无所容也。","久非其位，安得禽也。","婦人貞吉，從一而終也。夫子制義，從婦凶也。","振恆在上，大无功也。"]},{"n":"遯","g":"亨，小利貞。","lab":["初六","六二","九三","九四","九五","上九"],"y":["遯尾，厲，勿用有攸往。","執之用黃牛之革，莫之勝說。","係遯，有疾厲，畜臣妾吉。","好遯，君子吉，小人否。","嘉遯，貞吉。","肥遯，无不利。"],"d":"天下有山，遯；君子以遠小人，不惡而嚴。","x":["遯尾之厲，不往何災也。","執用黃牛，固志也。","係遯之厲，有疾憊也。畜臣妾吉，不可大事也。","君子好遯，小人否也。","嘉遯貞吉，以正志也。","肥遯，无不利；无所疑也。"]},{"n":"大壯","g":"利貞。","lab":["初九","九二","九三","九四","六五","上六"],"y":["壯于趾，征凶，有孚。","貞吉。","小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","貞吉悔亡，藩決不羸，壯于大輿之輹。","喪羊于易，无悔。","羝羊觸藩，不能退，不能遂，无攸利，艱則吉。"],"d":"雷在天上，大壯；君子以非禮弗履。","x":["壯于趾，其孚窮也。","九二貞吉，以中也。","小人用壯，君子罔也。","藩決不羸，尚往也。","喪羊于易，位不當也。","不能退，不能遂，不詳也。艱則吉，咎不長也。"]},{"n":"晉","g":"康侯用錫馬蕃庶，晝日三〓。","lab":["初六","六二","六三","九四","六五","上九"],"y":["晉如，摧如，貞吉。罔孚，裕无咎。","晉如，愁如，貞吉。受茲介福，于其王母。","眾允，悔亡。","晉如鼫鼠，貞厲。","悔亡，失得勿恤，往吉，无不利。","晉其角，維用伐邑，厲吉无咎，貞吝。"],"d":"明出地上，晉；君子以自昭明德。","x":["晉如，摧如；獨行正也。裕无咎；未受命也。","受茲介福，以中正也。","眾允之志，上行也。","鼫鼠貞厲，位不當也。","失得勿恤，往有慶也。","維用伐邑，道未光也。"]},{"n":"明夷","g":"利艱貞。","lab":["初九","六二","九三","六四","六五","上六"],"y":["明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。","明夷，夷于左股，用拯馬壯，吉。","明夷于南狩，得其大首，不可疾貞。","入于左腹，獲明夷之心，于出門庭。","箕子之明夷，利貞。","不明晦，初登于天，後入于地。"],"d":"明入地中，明夷；君子以蒞眾，用晦而明。","x":["君子于行，義不食也。","六二之吉，順以則也。","南狩之志，乃大得也。","入于左腹，獲心意也。","箕子之貞，明不可息也。","初登于天，照四國也。後入于地，失則也。"]},{"n":"家人","g":"利女貞。","lab":["初九","六二","九三","六四","九五","上九"],"y":["閑有家，悔亡。","无攸遂，在中饋，貞吉。","家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。","富家，大吉。","王假有家，勿恤，吉。","有孚威如，終吉。"],"d":"風自火出，家人；君子以言有物，而行有恆。","x":["閑有家，志未變也。","六二之吉，順以巽也。","家人嗃嗃，未失也；婦子嘻嘻，失家節也。","富家大吉，順在位也。","王假有家，交相愛也。","威如之吉，反身之謂也。"]},{"n":"睽","g":"小事吉。","lab":["初九","九二","六三","九四","六五","上九"],"y":["悔亡，喪馬勿逐，自復；見惡人无咎。","遇主于巷，无咎。","見輿曳，其牛掣，其人天且劓，无初有終。","睽孤，遇元夫，交孚，厲无咎。","悔亡，厥宗噬膚，往何咎。","睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。"],"d":"上火下澤，睽；君子以同而異。","x":["見惡人，以辟咎也。","遇主于巷，未失道也。","見輿曳，位不當也。无初有終，遇剛也。","交孚无咎，志行也。","厥宗噬膚，往有慶也。","遇雨之吉，群疑亡也。"]},{"n":"蹇","g":"利西南，不利東北；利見大人，貞吉。","lab":["初六","六二","九三","六四","九五","上六"],"y":["往蹇，來譽。","王臣蹇蹇，匪躬之故。","往蹇來反。","往蹇來連。","大蹇朋來。","往蹇來碩，吉；利見大人。"],"d":"山上有水，蹇；君子以反身修德。","x":["往蹇來譽，宜待也。","王臣蹇蹇，終无尤也。","往蹇來反，內喜之也。","往蹇來連，當位實也。","大蹇朋來，以中節也。","往蹇來碩，志在內也。利見大人，以從貴也。"]},{"n":"解","g":"利西南，无所往，其來復吉。有攸往，夙吉。","lab":["初六","九二","六三","九四","六五","上六"],"y":["无咎。","田獲三狐，得黃矢，貞吉。","負且乘，致寇至，貞吝。","解而拇，朋至斯孚。","君子維有解，吉；有孚于小人。","公用射隼于高墉之上，獲之，无不利。"],"d":"雷雨作，解；君子以赦過宥罪。","x":["剛柔之際，義无咎也。","九二貞吉，得中道也。","負且乘，亦可醜也。自我致戎，又誰咎也？","解而拇，未當位也。","君子有解，小人退也。","公用射隼，以解悖也。"]},{"n":"損","g":"有孚，元吉，无咎，可貞，利有攸往。曷之用，二簋可用享。","lab":["初九","九二","六三","六四","六五","上九"],"y":["已事遄往，无咎，酌損之。","利貞，征凶，弗損，益之。","三人行，則損一人；一人行，則得其友。","損其疾，使遄有喜，无咎。","或益之，十朋之龜弗克違，元吉。","弗損益之，无咎，貞吉，利有攸往，得臣无家。"],"d":"山下有澤，損；君子以懲忿窒欲。","x":["已事遄往，尚合志也。","九二利貞，中以為志也。","一人行，三則疑也。","損其疾，亦可喜也。","六五元吉，自上祐也。","弗損益之，大得志也。"]},{"n":"益","g":"利有攸往，利涉大川。","lab":["初九","六二","六三","六四","九五","上九"],"y":["利用為大作，元吉，无咎。","或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。","益之用凶事，无咎。有孚中行，告公用圭。","中行，告公從。利用為依遷國。","有孚惠心，勿問元吉。有孚惠我德。","莫益之，或擊之，立心勿恆，凶。"],"d":"風雷，益；君子以見善則遷，有過則改。","x":["元吉无咎，下不厚事也。","或益之，自外來也。","益用凶事，固有之也。","告公從，以益志也。","有孚惠心，勿問之矣。惠我德，大得志也。","莫益之，偏辭也。或擊之，自外來也。"]},{"n":"夬","g":"揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往。","lab":["初九","九二","九三","九四","九五","上六"],"y":["壯于前趾，往不勝為咎。","惕號，莫夜有戎，勿恤。","壯于頄，有凶。君子夬夬，獨行，遇雨，若濡，有慍，无咎。","臀无膚，其行次且。牽羊悔亡，聞言不信。","莧陸夬夬，中行无咎。","无號，終有凶。"],"d":"澤上於天，夬；君子以施祿及下，居德則忌。","x":["不勝而往，咎也。","有戎勿恤，得中道也。","君子夬夬，終无咎也。","其行次且，位不當也。聞言不信，聰不明也。","中行无咎，中未光也。","无號之凶，終不可長也。"]},{"n":"姤","g":"女壯，勿用取女。","lab":["初六","九二","九三","九四","九五","上九"],"y":["繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。","包有魚，无咎，不利賓。","臀无膚，其行次且，厲，无大咎。","包无魚，起凶。","以杞包瓜，含章，有隕自天。","姤其角，吝，无咎。"],"d":"天下有風，姤；后以施命誥四方。","x":["繫于金柅，柔道牽也。","包有魚，義不及賓也。","其行次且，行未牽也。","无魚之凶，遠民也。","九五含章，中正也。有隕自天，志不舍命也。","姤其角，上窮吝也。"]},{"n":"萃","g":"亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。","lab":["初六","六二","六三","九四","九五","上六"],"y":["有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎。","引吉，无咎，孚乃利用禴。","萃如，嗟如，无攸利，往无咎，小吝。","大吉，无咎。","萃有位，无咎。匪孚，元永貞，悔亡。","齎咨涕洟，无咎。"],"d":"澤上於地，萃；君子以除戎器，戒不虞。","x":["乃亂乃萃，其志亂也。","引吉无咎，中未變也。","往无咎，上巽也。","大吉无咎，位不當也。","萃有位，志未光也。","齎咨涕洟，未安上也。"]},{"n":"升","g":"元亨，用見大人，勿恤，南征吉。","lab":["初六","九二","九三","六四","六五","上六"],"y":["允升，大吉。","孚乃利用禴，无咎。","升虛邑。","王用亨于岐山，吉无咎。","貞吉，升階。","冥升，利于不息之貞。"],"d":"地中生木，升；君子以順德，積小以高大。","x":["允升大吉，上合志也。","九二之孚，有喜也。","升虛邑，无所疑也。","王用亨于岐山，順事也。","貞吉升階，大得志也。","冥升在上，消不富也。"]},{"n":"困","g":"亨，貞，大人吉，无咎，有言不信。","lab":["初六","九二","六三","九四","九五","上六"],"y":["臀困于株木，入于幽谷，三歲不覿。","困于酒食，朱紱方來，利用亨祀，征凶，无咎。","困于石，據于蒺蔾，入于其宮，不見其妻，凶。","來徐徐，困于金車，吝，有終。","劓刖，困于赤紱，乃徐有說，利用祭祀。","困于葛藟，于臲卼，曰動悔。有悔，征吉。"],"d":"澤无水，困；君子以致命遂志。","x":["入于幽谷，幽不明也。","困于酒食，中有慶也。","據于蒺蔾，乘剛也。入于其宮，不見其妻，不祥也。","來徐徐，志在下也。雖不當位，有與也。","劓刖，志未得也。乃徐有說，以中直也。利用祭祀，受福也。","困于葛藟，未當也。動悔，有悔，吉行也。"]},{"n":"井","g":"改邑不改井，无喪无得，往來井井。汔至，亦未繘井，羸其瓶，凶。","lab":["初六","九二","九三","六四","九五","上六"],"y":["井泥不食，舊井无禽。","井谷射鮒，甕敝漏。","井渫不食，為我心惻，可用汲，王明，並受其福。","井甃，无咎。","井冽，寒泉食。","井收勿幕，有孚元吉。"],"d":"木上有水，井；君子以勞民勸相。","x":["井泥不食，下也。舊井无禽，時舍也。","井谷射鮒，无與也。","井渫不食，行惻也。求王明，受福也。","井甃无咎，脩井也。","寒泉之食，中正也。","元吉在上，大成也。"]},{"n":"革","g":"巳日乃孚，元亨利貞，悔亡。","lab":["初九","六二","九三","九四","九五","上六"],"y":["鞏用黃牛之革。","巳日乃革之，征吉，无咎。","征凶，貞厲，革言三就，有孚。","悔亡，有孚改命，吉。","大人虎變，未占有孚。","君子豹變，小人革面，征凶，居貞吉。"],"d":"澤中有火，革；君子以治歷明時。","x":["鞏用黃牛，不可以有為也。","已日革之，行有嘉也。","革言三就，又何之矣。","改命之吉，信志也。","大人虎變，其文炳也。","君子豹變，其文蔚也。小人革面，順以從君也。"]},{"n":"鼎","g":"元吉，亨。","lab":["初六","九二","九三","九四","六五","上九"],"y":["鼎顛趾，利出否，得妾以其子，无咎。","鼎有實，我仇有疾，不我能即，吉。","鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。","鼎折足，覆公餗，其形渥，凶。","鼎黃耳，金鉉，利貞。","鼎玉鉉，大吉，无不利。"],"d":"木上有火，鼎；君子以正位凝命。","x":["鼎顛趾，未悖也。利出否，以從貴也。","鼎有實，慎所之也。我仇有疾，終无尤也。","鼎耳革，失其義也。","覆公餗，信如何也。","鼎黃耳，中以為實也。","玉鉉在上，剛柔節也。"]},{"n":"震","g":"亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。","lab":["初九","六二","六三","九四","六五","上六"],"y":["震來虩虩，後笑言啞啞，吉。","震來厲，億喪貝，躋于九陵，勿逐，七日得。","震蘇蘇，震行无眚。","震遂泥。","震往來厲，億无喪，有事。","震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。"],"d":"洊雷，震；君子以恐懼脩省。","x":["震來虩虩，恐致福也。笑言啞啞，後有則也。","震來厲，乘剛也。","震蘇蘇，位不當也。","震遂泥，未光也。","震往來厲，危行也。其事在中，大无喪也。","震索索，中未得也。雖凶无咎，畏鄰戒也。"]},{"n":"艮","g":"艮其背，不獲其身，行其庭，不見其人，无咎。","lab":["初六","六二","九三","六四","六五","上九"],"y":["艮其趾，无咎，利永貞。","艮其腓，不拯其隨，其心不快。","艮其限，列其夤，厲薰心。","艮其身，无咎。","艮其輔，言有序，悔亡。","敦艮，吉。"],"d":"兼山，艮；君子以思不出其位。","x":["艮其趾，未失正也。","不拯其隨，未退聽也。","艮其限，危薰心也。","艮其身，止諸躬也。","艮其輔，以中正也。","敦艮之吉，以厚終也。"]},{"n":"漸","g":"女歸吉，利貞。","lab":["初六","六二","九三","六四","九五","上九"],"y":["鴻漸于干，小子厲，有言，无咎。","鴻漸于磐，飲食衎衎，吉。","鴻漸于陸，夫征不復，婦孕不育，凶；利禦寇。","鴻漸于木，或得其桷，无咎。","鴻漸于陵，婦三歲不孕，終莫之勝，吉。","鴻漸于陸，其羽可用為儀，吉。"],"d":"山上有木，漸；君子以居賢德，善俗。","x":["小子之厲，義无咎也。","飲食衎衎，不素飽也。","夫征不復，離群醜也。婦孕不育，失其道也。利用禦寇，順相保也。","或得其桷，順以巽也。","終莫之勝，吉；得所願也。","其羽可用為儀，吉；不可亂也。"]},{"n":"歸妹","g":"征凶，无攸利。","lab":["初九","九二","六三","九四","六五","上六"],"y":["歸妹以娣，跛能履，征吉。","眇能視，利幽人之貞。","歸妹以須，反歸以娣。","歸妹愆期，遲歸有時。","帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。","女承筐无實，士刲羊无血，无攸利。"],"d":"澤上有雷，歸妹；君子以永終知敝。","x":["歸妹以娣，以恆也。跛能履吉，相承也。","利幽人之貞，未變常也。","歸妹以須，未當也。","愆期之志，有待而行也。","帝乙歸妹，不如其娣之袂良也。其位在中，以貴行也。","上六无實，承虛筐也。"]},{"n":"豐","g":"亨，王假之，勿憂，宜日中。","lab":["初九","六二","九三","九四","六五","上六"],"y":["遇其配主，雖旬无咎，往有尚。","豐其蔀，日中見斗，往得疑疾，有孚發若，吉。","豐其沛，日中見沬，折其右肱，无咎。","豐其蔀，日中見斗，遇其夷主，吉。","來章，有慶譽，吉。","豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。"],"d":"雷電皆至，豐；君子以折獄致刑。","x":["雖旬无咎，過旬災也。","有孚發若，信以發志也。","豐其沛，不可大事也。折其右肱，終不可用也。","豐其蔀，位不當也。日中見斗，幽不明也。遇其夷主，吉；行也。","六五之吉，有慶也。","豐其屋，天際翔也。闚其戶，闃其无人，自藏也。"]},{"n":"旅","g":"小亨，旅貞吉。","lab":["初六","六二","九三","九四","六五","上九"],"y":["旅瑣瑣，斯其所取災。","旅即次，懷其資，得童僕貞。","旅焚其次，喪其童僕，貞厲。","旅于處，得其資斧，我心不快。","射雉一矢亡，終以譽命。","鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。"],"d":"山上有火，旅；君子以明慎用刑，而不留獄。","x":["旅瑣瑣，志窮災也。","得童僕貞，終无尤也。","旅焚其次，亦以傷矣。以旅與下，其義喪也。","旅于處，未得位也。得其資斧，心未快也。","終以譽命，上逮也。","以旅在上，其義焚也。喪牛于易，終莫之聞也。"]},{"n":"巽","g":"小亨，利有攸往，利見大人。","lab":["初六","九二","九三","六四","九五","上九"],"y":["進退，利武人之貞。","巽在牀下，用史巫紛若，吉，无咎。","頻巽，吝。","悔亡，田獲三品。","貞吉悔亡，无不利。无初有終，先庚三日，後庚三日，吉。","巽在牀下，喪其資斧，貞凶。"],"d":"隨風，巽；君子以申命行事。","x":["進退，志疑也。利武人之貞，志治也。","紛若之吉，得中也。","頻巽之吝，志窮也。","田獲三品，有功也。","九五之吉，位正中也。","巽在牀下，上窮也。喪其資斧，正乎凶也。"]},{"n":"兌","g":"亨，利貞。","lab":["初九","九二","六三","九四","九五","上六"],"y":["和兌，吉。","孚兌，吉，悔亡。","來兌，凶。","商兌，未寧，介疾有喜。","孚于剝，有厲。","引兌。"],"d":"麗澤，兌；君子以朋友講習。","x":["和兌之吉，行未疑也。","孚兌之吉，信志也。","來兌之凶，位不當也。","九四之喜，有慶也。","孚于剝，位正當也。","上六引兌，未光也。"]},{"n":"渙","g":"亨。王假有廟，利涉大川，利貞。","lab":["初六","九二","六三","六四","九五","上九"],"y":["用拯馬壯，吉。","渙奔其机，悔亡。","渙其躬，无悔。","渙其群，元吉。渙有丘，匪夷所思。","渙汗其大號，渙王居，无咎。","渙其血，去逖出，无咎。"],"d":"風行水上，渙；先王以享于帝立廟。","x":["初六之吉，順也。","渙奔其机，得願也。","渙其躬，志在外也。","渙其群，元吉；光大也。","王居无咎，正位也。","渙其血，遠害也。"]},{"n":"節","g":"亨。苦節，不可貞。","lab":["初九","九二","六三","六四","九五","上六"],"y":["不出戶庭，无咎。","不出門庭，凶。","不節若，則嗟若，无咎。","安節，亨。","甘節，吉；往有尚。","苦節，貞凶，悔亡。"],"d":"澤上有水，節；君子以制數度，議德行。","x":["不出戶庭，知通塞也。","不出門庭凶，失時極也。","不節之嗟，又誰咎也。","安節之亨，承上道也。","甘節之吉，居位中也。","苦節貞凶，其道窮也。"]},{"n":"中孚","g":"豚魚吉，利涉大川，利貞。","lab":["初九","九二","六三","六四","九五","上九"],"y":["虞吉，有它不燕。","鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","得敵，或鼓或罷，或泣或歌。","月幾望，馬匹亡，无咎。","有孚攣如，无咎。","翰音登于天，貞凶。"],"d":"澤上有風，中孚；君子以議獄緩死。","x":["初九虞吉，志未變也。","其子和之，中心願也。","或鼓或罷，位不當也。","馬匹亡，絕類上也。","有孚攣如，位正當也。","翰音登于天，何可長也。"]},{"n":"小過","g":"亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。","lab":["初六","六二","九三","九四","六五","上六"],"y":["飛鳥以凶。","過其祖，遇其妣；不及其君，遇其臣；无咎。","弗過防之，從或戕之，凶。","无咎，弗過遇之。往厲必戒，勿用永貞。","密雲不雨，自我西郊，公弋取彼在穴。","弗遇過之，飛鳥離之，凶，是謂災眚。"],"d":"山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。","x":["飛鳥以凶，不可如何也。","不及其君，臣不可過也。","從或戕之，凶如何也。","弗過遇之，位不當也。往厲必戒，終不可長也。","密雲不雨，已上也。","弗遇過之，已亢也。"]},{"n":"既濟","g":"亨，小利貞，初吉終亂。","lab":["初九","六二","九三","六四","九五","上六"],"y":["曳其輪，濡其尾，无咎。","婦喪其茀，勿逐，七日得。","高宗伐鬼方，三年克之，小人勿用。","繻有衣袽，終日戒。","東鄰殺牛，不如西鄰之禴祭，實受其福。","濡其首，厲。"],"d":"水在火上，既濟；君子以思患而豫防之。","x":["曳其輪，義无咎也。","七日得，以中道也。","三年克之，憊也。","終日戒，有所疑也。","東鄰殺牛，不如西鄰之時也；實受其福，吉大來也。","濡其首厲，何可久也。"]},{"n":"未濟","g":"亨，小狐汔濟，濡其尾，无攸利。","lab":["初六","九二","六三","九四","六五","上九"],"y":["濡其尾，吝。","曳其輪，貞吉。","未濟，征凶，利涉大川。","貞吉，悔亡，震用伐鬼方，三年有賞于大國。","貞吉，无悔，君子之光，有孚，吉。","有孚于飲酒，无咎，濡其首，有孚失是。"],"d":"火在水上，未濟；君子以慎辨物居方。","x":["濡其尾，亦不知極也。","九二貞吉，中以行正也。","未濟征凶，位不當也。","貞吉悔亡，志行也。","君子之光，其暉吉也。","飲酒濡首，亦不知節也。"]}];

const Cases = {
  list: LS.get("liuyao.cases.v1", []).filter(c => c && c.id && Array.isArray(c.lines)),
  status: "local", col: null, known: new Set(), subs: [],
  on(fn) { this.subs.push(fn); }, emit() { this.subs.forEach(f => f()); },
  sort() { this.list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
  saveLocal() { LS.set("liuyao.cases.v1", this.list); },
  get(id) { return this.list.find(c => c.id === id) || null; },
  async put(c) {
    c.updatedAt = Date.now();
    const i = this.list.findIndex(x => x.id === c.id);
    if (i >= 0) this.list[i] = c; else this.list.unshift(c);
    this.sort(); this.saveLocal(); this.emit();
    if (this.col) { try { await this.col.doc(c.id).set(JSON.parse(JSON.stringify(c))); } catch (e) { toast("帳戶存檔沒有成功，這筆先存在本瀏覽器。"); } }
  },
  async remove(id) {
    this.list = this.list.filter(c => c.id !== id); this.saveLocal(); this.emit();
    if (this.col) { try { await this.col.doc(id).delete(); } catch (e) { toast("帳戶裡的刪除沒有成功，稍後再試一次。"); } }
  },
  async initCloud() {
    const cl = window.claude;
    if (!cl || typeof cl.use !== "function") return;
    try {
      const [db, user] = await Promise.all([cl.use("db"), cl.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const col = db.doc("data/users/" + uid + "/liuyao").collection("cases");
      let synced = false;
      col.onSnapshot(snap => {
        if (!synced && snap.metadata.fromCache) return;
        const remote = snap.docs.map(d => d.data()).filter(x => x && x.id && Array.isArray(x.lines));
        if (!synced) {
          synced = true;
          const ids = new Set(remote.map(c => c.id));
          const missing = this.list.filter(c => !ids.has(c.id));
          (async () => { for (const c of missing) { try { await col.doc(c.id).set(JSON.parse(JSON.stringify(c))); } catch (e) { /* 留在本機 */ } } })();
          this.list = remote.map(x => JSON.parse(JSON.stringify(x))).concat(missing);
        } else {
          const pending = this.list.filter(c => !remote.some(r => r.id === c.id) && !this.known.has(c.id));
          this.list = remote.map(x => JSON.parse(JSON.stringify(x))).concat(pending);
        }
        this.known = new Set(remote.map(r => r.id));
        this.sort(); this.saveLocal(); this.status = "cloud"; this.emit();
      }, () => { this.col = null; this.status = "local"; this.emit(); });
      this.col = col;
    } catch (e) { /* 留在本機 */ }
  }
};

function relMarks() {
  const set = new Set();
  if (S.sel == null || !S.chart) return set;
  const r = S.chart.relations.find(x => x.id === S.sel);
  if (r) { if (r.pos != null) set.add(r.pos); if (r.apos != null) set.add(r.apos); }
  return set;
}
const GROUP_NAME = { hc: "合沖", sk: "生剋", kong: "旬空" };
function relHTML(r, top) {
  const dim = S.focus != null && !(r.pos === S.focus || r.apos === S.focus) ? " is-dim" : "";
  const sel = S.sel === r.id ? " is-sel" : "";
  return `<div class="rel${top ? " is-top" : ""}${dim}${sel}" data-act="rel" data-id="${r.id}" role="button" tabindex="0" aria-pressed="${S.sel === r.id}">
    <div class="rel-power" title="力量 ${r.score}"><div class="rel-bar"><i style="width:${r.score}%"></i></div>${S.prefs.score ? `<span class="rel-score">${r.score}</span>` : ""}</div>
    <div class="rel-title"><span class="verdict ${r.group}">${esc(r.verdict)}</span><span>${esc(r.title)}</span></div>
    <div class="rel-note">${esc(r.note)}</div>
  </div>`;
}
function relCardHTML(ch) {
  const R = ch.relations;
  const topN = Math.max(1, Math.min(8, S.prefs.top | 0));
  const top = R.slice(0, topN);
  const topIds = new Set(top.map(r => r.id));
  const all = g => R.filter(r => r.group === g);
  const sec = (g) => {
    const list = all(g), rest = list.filter(r => !topIds.has(r.id));
    if (!list.length) return "";
    const inTop = list.length - rest.length;
    return `<section class="rel-sec" id="rs-${g}"><h3>${GROUP_NAME[g]}<small>${list.length} 條${inTop ? `，其中 ${inTop} 條已排在最要緊，其餘依力量排序` : "，依力量排序"}</small></h3>${rest.length ? rest.map(r => relHTML(r, false)).join("") : `<p class="hint" style="padding:0 20px 6px">都已列在最要緊。</p>`}</section>`;
  };
  const jump = ["hc", "sk", "kong"].filter(g => all(g).length).map(g => `<button type="button" data-act="jump" data-sec="rs-${g}">${GROUP_NAME[g]}<b>${all(g).length}</b></button>`).join("");
  const focusBar = S.focus != null ? `<div class="focusbar"><span>聚焦：${Y.POS_SHORT[S.focus]}${ch.lines[S.focus].shi ? "（世）" : ch.lines[S.focus].ying ? "（應）" : ""}，其他關係變淡但都還在</span><button type="button" class="btn btn-sm" data-act="focus-clear">取消聚焦</button></div>` : "";
  return `<div class="card rel-card">
    <div class="card-head"><div class="card-title">關係清單<small>共 ${R.length} 條；先論合沖、再論生剋，每條都列</small></div></div>
    <div class="rel-jump" role="navigation" aria-label="跳到分類"><button type="button" data-act="jump" data-sec="rs-top">最要緊<b>${top.length}</b></button>${jump}</div>
    ${focusBar}
    <section class="rel-sec" id="rs-top"><h3>最要緊<small>力量最強的 ${top.length} 條</small></h3>${top.map(r => relHTML(r, true)).join("")}</section>
    ${sec("hc")}${sec("sk")}${sec("kong")}
    <details class="rule-note"><summary>力量怎麼算、規則出處</summary>
      <ul>
        <li>力量 0–100：施力者（日辰、月建最強，其次變爻對本位動爻，再次動爻、暗動爻，靜爻最弱）× 關係類型 × 施力爻的旺衰。旺衰以月令為主，日辰生扶、回頭生、化進加分，日剋、合絆、回頭剋、化退、化空、化破、化墓絕減分。</li>
        <li>同分時合沖排在生剋前。左邊色條是力量，數字可在「設定」關掉。</li>
        <li>暗動、日破、沖散、合起、合絆、月破、月合、旬空、生旺墓絕、變爻只生剋本位、靜爻旺相可生剋休囚、三合成局條件、反伏：依《增刪卜易》各章。</li>
        <li>進神退神：亥化子、寅化卯、巳化午、申化酉、丑化辰、辰化未、未化戌、戌化丑為進，反之為退（《增刪卜易·進神退神章》）。</li>
        <li>飛伏：伏剋飛神為出暴、飛來剋伏反傷身、伏去生飛名洩氣、飛來生伏得長生、飛伏比和為有助（《卜筮正宗》）。卦反吟：乾巽、坎離、艮坤、震兌互變；伏吟：乾震互變。</li>
        <li>長生取水土同宮：土長生申、旺子、墓辰、絕巳。</li>
      </ul>
    </details>
  </div>`;
}

/* 文字盤 */
function chartPlainText(ch) {
  const { ben, bian, mom } = ch, d = S.snap ? S.snap.date : null;
  const L = [];
  L.push(`六爻排盤｜${ben.full}${bian ? "之" + bian.full : "（靜卦）"}`);
  if (S.snap && S.snap.q) L.push(`占事：${S.snap.q}`);
  if (d) L.push(`時間：${fmtDate(d)}（${tzText(mom.tz)}）　農曆${mom.lunar ? C.lunarText(mom.lunar).replace(/^\d+年/, "") : "—"}`);
  L.push(`四柱：${Y.gzName(mom.yearIdx)}年 ${Y.gzName(mom.monthIdx)}月 ${Y.gzName(mom.dayIdx)}日 ${Y.gzName(mom.hourIdx)}時　旬空：${mom.xunkong.map(b => ZHI[b]).join("")}`);
  L.push(`起卦：${methodText(S.snap, ch)}`);
  L.push(`本卦：${ben.full}（${ben.palaceName}宮${ben.genName}${ben.pair ? "，" + ben.pair : ""}）${bian ? `　變卦：${bian.full}（${bian.palaceName}宮${bian.genName}${bian.pair ? "，" + bian.pair : ""}）` : ""}`);
  L.push("");
  for (let k = 5; k >= 0; k--) {
    const x = ch.lines[k];
    const sy = x.shi ? "世" : x.ying ? "應" : "　";
    const mk = x.moving ? (x.yang ? "○" : "✕") : "　";
    const fu = x.fu ? `伏${x.fu.qin}${GAN[x.fu.g]}${ZHI[x.fu.b]}${WX[x.fu.wx]}` : "";
    const tags = ch.summary[k].tags.map(t => t.t).concat(ch.summary[k].hua.map(t => t.t));
    L.push(`${x.shen}　${x.qin}${GAN[x.g]}${ZHI[x.b]}${WX[x.wx]} ${x.yang ? "⚊" : "⚋"}${mk}${sy}${x.moving ? `　→ ${x.change.qin}${GAN[x.change.g]}${ZHI[x.change.b]}${WX[x.change.wx]}` : ""}${fu ? "　" + fu : ""}${tags.length ? "　［" + tags.join("、") + "］" : ""}`);
  }
  L.push("");
  L.push("關係（依力量排序）：");
  ch.relations.forEach((r, i) => L.push(`${i + 1}. [${GROUP_NAME[r.group]}｜${r.score}] ${r.title}：${r.verdict}`));
  return L.join("\n");
}

async function exportCases() {
  const data = JSON.stringify({ app: "liuyao-paipan", version: 1, exportedAt: new Date().toISOString(), cases: Cases.list }, null, 1);
  const name = `liuyao-cases-${new Date().toISOString().slice(0, 10)}.json`;   // 檔名用英數，避免部分瀏覽器把中文檔名換成 download
  const cl = window.claude;
  if (cl && typeof cl.use === "function") {
    try {
      const dl = await cl.use("downloads");
      if (dl) { await dl.save({ filename: name, data }); toast("已交給下載"); return; }
    } catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("已下載 " + name);
  } catch (e) { copyText(data, "已複製 JSON"); }
}
async function importCases(file) {
  try {
    const obj = JSON.parse(await file.text());
    const arr = Array.isArray(obj) ? obj : obj.cases;
    if (!Array.isArray(arr)) throw new Error("bad");
    let n = 0;
    for (const c of arr) {
      if (!c || !c.id || !Array.isArray(c.lines) || c.lines.length !== 6 || !c.date) continue;
      if (Cases.get(c.id)) continue;
      await Cases.put(c); n++;
    }
    toast(n ? `匯入 ${n} 筆卦例` : "沒有新的卦例可匯入");
  } catch (e) { toast("這個檔案讀不出卦例，請選之前匯出的 JSON"); }
}

      <span class="tc-prev" style="background:${t.bg}"><span class="b" style="background:${t.bar}"></span><span class="c" style="background:${t.card};color:${t.ink}"><i style="background:${t.accent}"></i><i style="background:${wx.mu}"></i><i style="background:${wx.huo}"></i></span></span>${esc(label || t.name)}</button>`;
  };
  pg.innerHTML = `<div class="card">
    <section class="set-sec"><h3>主題</h3>
      <div class="themes">
        <button type="button" class="tc" data-act="theme" data-id="auto" aria-pressed="${S.theme.id === "auto"}"><span class="tc-prev"><span class="b" style="background:linear-gradient(90deg,#1F2430 50%,#0B0C0E 50%)"></span><span class="c" style="background:linear-gradient(90deg,#FFFFFF 50%,#1A1C20 50%);color:#888">淺／深</span></span>跟隨系統</button>
        ${THEMES.map(t => sw(t)).join("")}
      </div>
    </section>
    <section class="set-sec"><h3>原文</h3>
      <label class="switch"><input type="checkbox" id="s-avoid" data-act="pref" data-k="avoid"${S.prefs.avoid ? " checked" : ""}> 原文避字：那個字以「□」代替（共兩處：晉卦辭、蒙卦九二小象）</label>
      <p class="hint">關掉就顯示原字。這個設定只影響畫面與複製出去的文字，程式碼裡不含那個字。</p>
    </section>
    <section class="set-sec"><h3>關係清單</h3>
      <label class="switch"><input type="checkbox" id="s-score" data-act="pref" data-k="score"${S.prefs.score ? " checked" : ""}> 顯示力量分數</label>
      <div class="range"><label for="s-top">「最要緊」列幾條</label><input type="range" id="s-top" min="3" max="8" step="1" value="${S.prefs.top}" data-act="pref-top"><output id="s-top-out" for="s-top">${S.prefs.top}</output></div>
      <p class="hint">「最要緊」只是把力量最強的幾條放在最上面；下方合沖、生剋、旬空三段仍然每條都列。</p>
    </section>
    <section class="set-sec"><h3>關於</h3>
      <p class="hint">節氣用 VSOP87 截斷級數、農曆用 Meeus 真朔與中氣置閏，曆算與同倉庫的八字排盤相同，並和 lunar-javascript 對過 1901–2099 年。排盤規則以《增刪卜易》為主，進退神、飛伏生剋、卦反吟伏吟參《卜筮正宗》。可用年份 ${Y_MIN}–${Y_MAX}。</p>
    </section>
  </div>`;
}

/* =========================================================
   導覽與事件
   ========================================================= */
function go(page) {
  S.page = page;
  $$(".nav-item").forEach(b => b.setAttribute("aria-current", b.dataset.page === page ? "page" : "false"));
  ["input", "chart", "text", "cases", "settings"].forEach(p => { $("#page-" + p).hidden = p !== page; });
  if (page === "input") renderInputPreview();
  else if (page === "chart") renderChart();
  else if (page === "text") renderText();
  else if (page === "cases") renderCases();
  else if (page === "settings") renderSettings();
  window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "go") { go(el.dataset.page); return; }
  if (act === "method") { S.method = el.dataset.method; saveDraft(); renderInputPreview(); return; }
  if (act === "pick") {
    const k = +el.dataset.pos, v = +el.dataset.v;
    S.manual[k] = S.manual[k] === v ? null : v; saveDraft(); renderPicker(); renderInputPreview();
    const again = $(`[data-act="pick"][data-pos="${k}"][data-v="${v}"]`); if (again) again.focus();
    return;
  }
  if (act === "clear-lines") { S.manual = [null, null, null, null, null, null]; saveDraft(); renderPicker(); renderInputPreview(); return; }
  if (act === "now") { setDate(nowDate()); renderInputPreview(); return; }
  if (act === "focus") { const k = +el.dataset.pos; S.focus = S.focus === k ? null : k; renderChart(); return; }
  if (act === "focus-clear") { S.focus = null; renderChart(); return; }
  if (act === "jump") { const t = document.getElementById(el.dataset.sec); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (act === "rel") { const id = +el.dataset.id; S.sel = S.sel === id ? null : id; renderChart(); return; }
  if (act === "save-case") { saveCurrentCase(); return; }
  if (act === "copy-chart") { if (S.chart) copyText(plain(chartPlainText(S.chart)), "已複製文字盤"); return; }
  if (act === "modal-close") { closeModal(); return; }
  if (act === "case-open") { openCase(el.dataset.id); return; }
  if (act === "case-edit") { S.ui.editing = el.dataset.id; S.ui.confirming = null; renderCases(); return; }
  if (act === "case-cancel") { S.ui.editing = null; S.ui.confirming = null; renderCases(); return; }
  if (act === "case-rename") {
    const c = Cases.get(el.dataset.id), f = $("#ce-" + el.dataset.id);
    const name = f ? f.value.trim() : "";
    if (!name) { toast("名稱不能空白"); return; }
    if (c) { S.ui.editing = null; Cases.put(Object.assign({}, c, { title: name })); toast("已改名"); }
    return;
  }
  if (act === "case-del") { S.ui.confirming = el.dataset.id; S.ui.editing = null; renderCases(); return; }
  if (act === "case-del-yes") {
    const id = el.dataset.id; S.ui.confirming = null;
    if (S.curCaseId === id) S.curCaseId = null;
    Cases.remove(id); toast("已刪除"); return;
  }
  if (act === "export") { exportCases(); return; }
  if (act === "import") { $("#f-import").click(); return; }
  if (act === "theme") { S.theme.id = el.dataset.id; applyTheme(); renderSettings(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) { closeModal(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.matches && e.target.matches(".case-edit .field")) { const b = e.target.parentElement.querySelector('[data-act="case-rename"]'); if (b) b.click(); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === "pref") { S.prefs[el.dataset.k] = el.checked; savePrefs(); if (S.page === "settings") renderSettings(); return; }
  if (el.dataset && el.dataset.act === "toggle-full") { S.prefs.full = el.checked; savePrefs(); renderText(); return; }
  if (el.id === "f-import") { const f = el.files && el.files[0]; if (f) importCases(f); el.value = ""; return; }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === "pref-top") { S.prefs.top = +el.value; $("#s-top-out").textContent = el.value; savePrefs(); return; }
});
["f-n1", "f-n2", "f-n3"].forEach((id, i) => {
  $("#" + id).addEventListener("input", e => {
    const v = e.target.value.replace(/[^\d]/g, "");
    if (v !== e.target.value) e.target.value = v;
    S.nums[i] = v; saveDraft(); renderInputPreview();
  });
});
$("#f-q").addEventListener("input", e => { S.q = e.target.value; saveDraft(); });
$("#f-y").addEventListener("change", () => { fillDays(+$("#f-d").value); renderInputPreview(); });
$("#f-m").addEventListener("change", () => { fillDays(+$("#f-d").value); renderInputPreview(); });
["f-d", "f-hh", "f-mi"].forEach(id => $("#" + id).addEventListener("change", renderInputPreview));
$("#f-tz").addEventListener("change", e => { S.tzMode = e.target.value === "auto" ? "auto" : +e.target.value; saveDraft(); renderInputPreview(); });
$("#f-zs").addEventListener("change", e => { S.zishi = e.target.checked; saveDraft(); renderInputPreview(); });
$("#f-form").addEventListener("submit", e => { e.preventDefault(); castNow(); });

/* ---------- 開始 ---------- */
buildDateOptions();
setDate(nowDate());
$("#f-tz").value = String(S.tzMode);
if (!$("#f-tz").value) { S.tzMode = "auto"; $("#f-tz").value = "auto"; }
$("#f-zs").checked = S.zishi;
$("#f-n1").value = S.nums[0]; $("#f-n2").value = S.nums[1]; $("#f-n3").value = S.nums[2]; $("#f-q").value = S.q;
renderPicker();
const last = LS.get("liuyao.last.v1", null);
if (last && Array.isArray(last.lines) && last.date) { try { S.snap = last; S.chart = chartFromSnap(last); } catch (e) { S.snap = null; S.chart = null; } }
applyTheme();
const startPage = (location.hash || "").replace("#", "");
go(["input", "chart", "text", "cases", "settings"].includes(startPage) ? startPage : "input");
Cases.initCloud();
window.__liuyao = { S, Cases, go, castNow };   // 給自動測試用
})();

</script>
</body>
</html>
