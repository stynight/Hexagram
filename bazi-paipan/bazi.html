<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>八字排盤合盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="八字排盤與合盤：公曆、農曆、四柱輸入，基本排盤、專業細盤（大運流年流月流日流時）與兩人合盤關係清單。">
<style>
/* 版面：桌面左側導覽＋右側內容；手機頂部分頁。
   配色：每個主題只給底色、卡片、文字、主色、抬頭帶幾個基礎色，其餘全部由 color-mix 混出。淺色預設「月白」，深色預設「墨夜」，主題頁可換。 */
:root {
  --bg: #F3F4F6;
  --card: #FFFFFF;
  --ink: #1F2328;
  --accent: #4A5B8C;
  --on-accent: #FFFFFF;
  --bar: #1F2430;
  --bar-ink: #E6EAF2;
  --mu: #1A973D; --huo: #D2261E; --tu: #8A681B; --jin: #D5820A; --shui: #2B62D5;
  --danger: #B42318;
  --shadow: 0 1px 2px rgba(20, 24, 32, .05), 0 6px 18px rgba(20, 24, 32, .05);
  --card-2: color-mix(in srgb, var(--ink) 4%, var(--card));
  --ink-2: color-mix(in srgb, var(--ink) 74%, var(--card));
  --dim: color-mix(in srgb, var(--ink) 54%, var(--card));
  --line: color-mix(in srgb, var(--ink) 12%, var(--card));
  --line-2: color-mix(in srgb, var(--ink) 6%, var(--card));
  --gold: var(--accent);
  --gold-ink: color-mix(in srgb, var(--accent) 80%, var(--ink));
  --gold-soft: color-mix(in srgb, var(--accent) 15%, var(--card));
  --gold-softer: color-mix(in srgb, var(--accent) 6%, var(--card));
  --chip: color-mix(in srgb, var(--ink) 6%, var(--card));
  --scroll: color-mix(in srgb, var(--ink) 26%, var(--card));
  --bar-2: color-mix(in srgb, var(--bar-ink) 9%, var(--bar));
  --bar-dim: color-mix(in srgb, var(--bar-ink) 62%, var(--bar));
  --bar-accent: color-mix(in srgb, var(--accent) 50%, var(--bar-ink));
  --btn: var(--bar);
  --btn-ink: var(--bar-accent);
  --r: 14px;
  --f-serif: "Songti TC", "STSong", "Noto Serif CJK TC", "Source Han Serif TC", "Noto Serif TC", "PMingLiU", "SimSun", serif;
  --f-sans: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Hiragino Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111214; --card: #1A1C20; --ink: #E8EAED; --accent: #8AB4F8; --on-accent: #10131A;
    --bar: #0B0C0E; --bar-ink: #DDE3EC;
    --mu: #58CF78; --huo: #FF6B5E; --tu: #D4AA5E; --jin: #F2AA3A; --shui: #73A2FF;
    --danger: #FF7B6E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111214; --card: #1A1C20; --ink: #E8EAED; --accent: #8AB4F8; --on-accent: #10131A;
  --bar: #0B0C0E; --bar-ink: #DDE3EC;
  --mu: #58CF78; --huo: #FF6B5E; --tu: #D4AA5E; --jin: #F2AA3A; --shui: #73A2FF;
  --danger: #FF7B6E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-sans); font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.serif { font-family: var(--f-serif); }
.num { font-variant-numeric: tabular-nums; }
.w0 { color: var(--mu); } .w1 { color: var(--huo); } .w2 { color: var(--tu); } .w3 { color: var(--jin); } .w4 { color: var(--shui); }
.dim { color: var(--dim); }
.gold { color: var(--gold-ink); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- 外框 ---------- */
.app {
  display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 20px;
  max-width: 1520px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start;
  display: flex; flex-direction: column; gap: 6px;
}
.nav-brand { font-family: var(--f-serif); font-weight: 700; font-size: 18px; letter-spacing: .08em; color: var(--ink); padding: 6px 14px 12px; }
.nav-brand small { display: block; font-family: var(--f-sans); font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--dim); }
.nav-item {
  text-align: left; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink-2); font-size: 15px; position: relative;
}
.nav-item:hover { border-color: var(--gold); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.nav-item[aria-current="page"]::before { content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--gold); }
.nav-theme { margin-top: 10px; text-align: left; padding: 9px 16px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--dim); font-size: 13px; }
.nav-theme:hover { color: var(--ink); border-color: var(--gold); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.page { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

@media (max-width: 899px) {
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
  .app { display: block; padding: 0 0 40px; }
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; flex-direction: row; gap: 0;
    background: var(--bar);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    margin-bottom: 14px;
  }
  .nav-brand, .nav-theme { display: none; }
  .nav-item {
    flex: 1 1 0; min-width: 0; text-align: center; border: 0; border-radius: 0; background: transparent;
    color: var(--bar-dim); padding: 13px 2px 11px; font-size: 13.5px; white-space: nowrap;
  }
  .nav-item:hover { color: var(--bar-ink); border-color: transparent; }
  .nav-item[aria-current="page"] { background: transparent; color: var(--bar-accent); font-weight: 700; }
  .nav-item[aria-current="page"]::before { left: 22%; right: 22%; top: auto; bottom: 0; width: auto; height: 3px; border-radius: 3px 3px 0 0; background: var(--bar-accent); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* ---------- 通用 ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-pad { padding: 20px 22px; }
.card-title { font-family: var(--f-serif); font-size: 17px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-title small { font-family: var(--f-sans); font-size: 12px; font-weight: 400; color: var(--dim); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--gold); }
.btn-gold { background: var(--gold); border-color: var(--gold); color: var(--on-accent); }
.btn-gold:hover { filter: brightness(1.06); }
.btn-gray { background: color-mix(in srgb, var(--ink) 55%, var(--card)); border-color: transparent; color: var(--card); }
.btn-dark { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); font-weight: 700; letter-spacing: .12em; }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn-danger.solid { background: var(--danger); color: var(--card); border-color: var(--danger); }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; filter: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--gold-ink); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.hint { font-size: 12.5px; color: var(--dim); }
.empty { padding: 36px 22px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty p { margin: 0; color: var(--ink-2); max-width: 36em; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.chip.gold { background: var(--gold-soft); color: var(--gold-ink); }
.chip.warn { background: color-mix(in srgb, var(--danger) 12%, var(--card)); color: var(--danger); }

/* ---------- 輸入頁 ---------- */
.form { display: flex; flex-direction: column; gap: 18px; max-width: 760px; margin: 0 auto; width: 100%; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; background: var(--gold-softer); border: 1px solid var(--gold); color: var(--gold-ink); }
.frow { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; }
.frow > label, .frow > .flabel { color: var(--ink-2); font-size: 15px; }
.field {
  width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink);
}
.field:hover { border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); }
select.field { padding-right: 28px; }
.fgroup { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fgroup select.field { width: auto; min-width: 0; flex: 1 1 82px; }
.fgroup .unit { color: var(--dim); font-size: 13px; }
.sexmode { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.radios { display: flex; gap: 18px; }
.radio { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 15px; }
.radio input { appearance: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dim); margin: 0; display: grid; place-items: center; cursor: pointer; background: var(--card); }
.radio input::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.radio input:checked { border-color: var(--gold); }
.radio input:checked::after { background: var(--gold); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 7px 22px; border-radius: 999px; color: var(--ink-2); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-accent); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.checks { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 15px; }
.check input { appearance: none; width: 19px; height: 19px; border-radius: 4px; border: 1.5px solid var(--dim); margin: 0; display: grid; place-items: center; cursor: pointer; background: var(--card); }
.check input:checked { background: var(--gold); border-color: var(--gold); }
.check input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--on-accent); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.switch input { appearance: none; width: 44px; height: 24px; border-radius: 999px; background: var(--scroll); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #FFF; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch input:checked { background: var(--gold); }
.switch input:checked::after { transform: translateX(20px); }
.preview { padding: 12px 14px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
.preview .pv-gz { font-family: var(--f-serif); font-size: 22px; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
.preview .err { color: var(--danger); }
.gobtn { width: 100%; min-height: 58px; font-size: 18px; border-radius: 999px; }
.cands { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow: auto; padding: 2px; }
.cand { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 14px; }
.cand:hover { border-color: var(--gold); }
.cand:has(input:checked) { border-color: var(--gold); background: var(--gold-softer); }
.cand input { accent-color: var(--gold); margin: 0; }
.placebox { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.coords { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.coords label { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.coords input.field, .coords select.field { width: 108px; min-height: 36px; padding: 6px 8px; }
.coords select.field { width: 128px; }

/* 即時起局 */
.now-card {
  width: 100%; max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center;
  padding: 18px 24px; text-align: left; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); color: var(--ink);
}
.now-card:hover { border-color: var(--gold); }
.now-clock { width: 88px; height: 88px; }
.now-gz { font-family: var(--f-serif); font-size: 24px; font-weight: 700; letter-spacing: .32em; line-height: 1.45; }
.now-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 12.5px; color: var(--dim); }
.now-pill { padding: 6px 22px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold-ink); font-size: 15px; background: var(--card); }
.now-card:hover .now-pill { background: var(--gold); color: var(--on-accent); }

/* ---------- 案例列表 ---------- */
.caselist { display: flex; flex-direction: column; }
.case { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line-2); }
.case:first-child { border-top: 0; }
.case-name { font-family: var(--f-serif); font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.case-meta { font-size: 12.5px; color: var(--dim); }
.case-gz { font-family: var(--f-serif); font-size: 17px; font-weight: 700; letter-spacing: .14em; }
.case-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.case-edit { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.case-edit .field { max-width: 280px; min-height: 36px; }
.case-confirm { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--danger) 8%, var(--card)); color: var(--danger); }
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.listhead .field { max-width: 240px; min-height: 36px; }

/* ---------- 抬頭帶 ---------- */
.hbar {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center;
  padding: 16px 22px; border-radius: var(--r); color: var(--bar-ink);
  background: radial-gradient(120% 140% at 0% 0%, var(--bar-2) 0%, var(--bar) 60%);
  border: 1px solid color-mix(in srgb, var(--bar-ink) 12%, var(--bar));
  box-shadow: var(--shadow);
}
.sx { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sx-ring { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--bar-accent); color: var(--bar-accent); font-family: var(--f-serif); font-size: 26px; font-weight: 700; background: radial-gradient(circle at 35% 30%, var(--bar-2), var(--bar)); }
.sx-tag { font-size: 11.5px; color: var(--bar-accent); letter-spacing: .08em; }
.hbar-name { font-family: var(--f-serif); font-size: 26px; font-weight: 700; color: var(--bar-accent); letter-spacing: .04em; overflow-wrap: anywhere; }
.hbar-lines { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--bar-ink); }
.hbar-lines .k { color: var(--bar-dim); margin-right: 6px; }
.hbar-lines .zao { color: var(--bar-accent); }
.hbar-main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 22px; align-items: center; min-width: 0; }
.hbar-acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hbtn { min-height: 34px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--bar-accent); background: transparent; color: var(--bar-accent); font-size: 14px; }
.hbtn:hover { background: color-mix(in srgb, var(--bar-accent) 16%, transparent); }
.hdone { font-size: 13px; color: var(--bar-dim); padding: 0 6px; white-space: nowrap; }
.hbar .switch { color: var(--bar-ink); }
@media (max-width: 899px) {
  .hbar { grid-template-columns: auto minmax(0, 1fr); padding: 14px 16px; gap: 12px 14px; }
  .hbar-acts { grid-column: 1 / -1; justify-content: flex-start; }
  .hbar-main { grid-template-columns: minmax(0, 1fr); }
  .hbar-name { font-size: 20px; }
  .hbar-lines { font-size: 13px; }
  .sx-ring { width: 46px; height: 46px; font-size: 21px; }
}

/* ---------- 基本信息條 ---------- */
.infobar { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 18px; font-size: 13px; color: var(--ink-2); }
.infobar b { color: var(--ink); font-weight: 600; }
.bd-warn { color: var(--danger); font-weight: 600; }
.chip { border-radius: 4px; }
#page-basic { max-width: 1000px; }
.infogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 0; }
.infogrid > div { display: flex; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--line-2); font-size: 13.5px; min-width: 0; }
.infogrid .k { color: var(--dim); flex: none; width: 5.5em; }
.infogrid .v { min-width: 0; overflow-wrap: anywhere; }

/* ---------- 命盤表 ---------- */
.pan-wrap { overflow-x: auto; }
table.pan { --labw: 56px; width: 100%; border-collapse: collapse; table-layout: fixed; text-align: center; }
table.pan col.c-lab { width: var(--labw); }
table.pan th { font-weight: 400; color: var(--dim); font-size: 13px; text-align: center; padding: 0 2px; vertical-align: middle; }
table.pan .ssa { display: none; }
table.pan .nw { white-space: nowrap; }
table.pan td { padding: 2px 1px; vertical-align: middle; overflow-wrap: anywhere; }
table.pan tr > * { border-top: 0; }
table.pan tr.r-head td { color: var(--dim); font-size: 13px; padding: 10px 0 6px; }
table.pan tr.r-head td.on-dyn { color: var(--gold-ink); }
table.pan tr.r-ss td { font-size: 13.5px; padding: 3px 0; }
table.pan tr.r-big td { font-family: var(--f-serif); font-size: 36px; font-weight: 700; line-height: 1.18; padding: 2px 0; }
table.pan tr.r-big td .wxs { font-family: var(--f-sans); font-size: 11px; font-weight: 400; color: var(--dim); margin-left: 1px; vertical-align: 2px; }
table.pan tr.r-cang > * { background: var(--card-2); }
table.pan tr.r-cang td { font-size: 13px; line-height: 1.6; padding: 8px 1px; }
table.pan tr.r-cang td .cg { display: block; white-space: nowrap; }
table.pan tr.r-fu > * { background: var(--card-2); }
table.pan tr.r-fu td { font-size: 13px; line-height: 1.6; padding: 6px 1px 10px; color: var(--ink-2); }
table.pan tr.r-fu td .cg { display: block; white-space: nowrap; }
table.pan tr.r-sm td { font-size: 13.5px; padding: 5px 1px; color: var(--ink); }
table.pan tr.r-sm:nth-child(even) > * { background: color-mix(in srgb, var(--card-2) 55%, transparent); }
table.pan tr.r-ss2 td { font-size: 12px; color: var(--ink-2); }
table.pan tr.r-sha td { font-size: 12.5px; color: var(--gold-ink); line-height: 1.55; padding: 8px 1px; vertical-align: top; }
table.pan tr.r-sha td .sha { display: block; }
table.pan tr.r-sha th { vertical-align: top; padding-top: 8px; }
table.pan td.sep, table.pan th.sep { border-left: 1px solid var(--line); }
table.pan td.ph { color: var(--dim); }
table.pan td.ph .phhint { display: block; font-size: 11px; line-height: 1.3; }
table.pan td.ph .ph-s { display: none; }
table.pan col.c-dyn { background: transparent; }
.sha-toggle { display: flex; width: 100%; align-items: center; justify-content: center; gap: 4px; border: 1px dashed var(--line); background: transparent; border-radius: 8px; min-height: 34px; padding: 4px 8px; font-size: 13px; color: var(--gold-ink); margin-top: 8px; }
.sha-toggle:hover { border-color: var(--gold); }

/* 旺相休囚死：資訊帶，不做成按鈕樣子 */
.wbar { display: grid; grid-template-columns: auto repeat(5, minmax(0, 1fr)); align-items: center; background: var(--gold-softer); color: var(--gold-ink); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); font-size: 15px; letter-spacing: .08em; }
.wbar > span { text-align: center; padding: 8px 2px; }
.wbar > span b { font-weight: 700; font-family: var(--f-serif); }
.wbar > .wl { font-size: 12px; letter-spacing: 0; color: var(--dim); padding: 8px 10px; border-right: 1px solid var(--line); text-align: left; }
.wbar > span + span:not(:nth-child(2)) { border-left: 1px dotted color-mix(in srgb, var(--gold) 55%, transparent); }
.pro-right .wbar { border-bottom: 0; }
.page > .wbar { border-radius: 0; border-left: 0; border-right: 0; }

/* 留意 */
.attn { padding: 14px 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.attn-row { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 8px; }
.attn-row .k { color: var(--gold-ink); font-weight: 600; }
.attn-row .v { overflow-wrap: anywhere; }

/* ---------- 專業細盤 ---------- */
.pro { container-type: inline-size; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.pro-body { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pro-left, .pro-right { min-width: 0; }
.pro-left { padding: 8px 10px 12px; }
.pro-right { display: flex; flex-direction: column; overflow: hidden; }
@container (min-width: 1040px) {
  .pro-body { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); align-items: start; }
}
.pinfo { padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 13px; background: var(--card-2); border-bottom: 1px solid var(--line); }
.pinfo .k { color: var(--dim); margin-right: 4px; }
.pinfo-lines { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pinfo-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.pinfo-side .row { display: flex; gap: 8px; align-items: center; }
.siling { font-size: 14px; }
.siling b { font-family: var(--f-serif); font-size: 18px; }
.todaybtn { min-height: 34px; min-width: 52px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--gold); background: var(--card); color: var(--gold-ink); font-family: var(--f-serif); font-weight: 700; font-size: 14px; }
.todaybtn:hover { background: var(--gold); color: var(--on-accent); }
.algo { grid-column: 1 / -1; margin: 2px 0 0; font-size: 11.5px; color: var(--dim); line-height: 1.5; }

/* 干支條 */
.strip { display: grid; grid-template-columns: 46px minmax(0, 1fr); border-bottom: 1px solid var(--line); min-width: 0; }
.strip:last-of-type { border-bottom: 0; }
.strip-title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; font-family: var(--f-serif); font-weight: 700; font-size: 19px; line-height: 1.15; color: var(--ink); border-right: 1px solid var(--line-2); }
.strip-title small { font-family: var(--f-sans); font-weight: 400; font-size: 11px; color: var(--dim); margin-top: 4px; }
.strip-main { min-width: 0; display: flex; flex-direction: column; }
.strip-track { position: relative; display: flex; overflow-x: auto; scrollbar-width: none; scroll-behavior: auto; overscroll-behavior-x: contain; }
.strip-track::-webkit-scrollbar { display: none; }
.cell {
  flex: 0 0 auto; width: 58px; padding: 9px 0 6px; border: 0; border-right: 1px solid var(--line-2); background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.22; color: var(--ink); position: relative;
}
.cell:hover { background: var(--gold-softer); }
.cell[aria-pressed="true"] { background: var(--gold-soft); box-shadow: inset 0 -3px 0 var(--gold), inset 0 3px 0 var(--gold); }
.cell[aria-pressed="true"] .c-top { font-weight: 700; color: var(--ink); }
.cell .c-top { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.cell .c-sub { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.cell .c-gz { font-family: var(--f-serif); font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.cell .c-gz i { font-style: normal; font-family: var(--f-sans); font-size: 12px; font-weight: 400; color: var(--ink-2); margin-left: 1px; }
.cell .c-xy { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; }
.cell .c-big { font-family: var(--f-serif); font-size: 20px; font-weight: 700; line-height: 1.2; }
/* 今天：主題色小菱形；主色偏紅時改金色（沖是紅色圓點加字，在格子底部，兩者顏色、形狀、位置都不同） */
.cell.today::before { content: ""; position: absolute; top: 2px; left: 50%; width: 6px; height: 6px; margin-left: -3px; transform: rotate(45deg); border-radius: 1px; background: var(--today, var(--accent)); box-shadow: 0 0 0 1.5px var(--card); }
.cell.today[aria-pressed="true"]::before { box-shadow: 0 0 0 1.5px var(--gold-soft); }
.today-dot { display: inline-block; width: 6px; height: 6px; transform: rotate(45deg); border-radius: 1px; background: var(--today, var(--accent)); vertical-align: 1px; margin: 0 4px; }
.cell.unborn { opacity: .5; }
.strip.s-day .cell { width: 54px; }
.strip.s-hour .cell { width: 60px; }
.strip-empty { padding: 14px 12px; color: var(--dim); font-size: 13px; }
.sbar { display: grid; grid-template-columns: 22px minmax(0, 1fr) 22px; align-items: center; gap: 4px; padding: 2px 4px 5px; }
.sbar-btn { width: 22px; height: 20px; border: 0; background: transparent; color: var(--ink-2); font-size: 11px; padding: 0; border-radius: 4px; }
.sbar-btn:hover:not(:disabled) { background: var(--chip); color: var(--ink); }
.sbar-btn:disabled { opacity: .3; cursor: default; }
.sbar-rail { position: relative; height: 10px; border-radius: 5px; background: var(--line-2); cursor: pointer; touch-action: none; }
.sbar-thumb { position: absolute; top: 1px; left: 0; height: 8px; border-radius: 4px; background: var(--scroll); cursor: grab; min-width: 28px; touch-action: none; }
.sbar-thumb:active { cursor: grabbing; background: var(--gold); }
.strip.fits .sbar { display: none; }
.swipe-hint { font-size: 11.5px; color: var(--dim); padding: 6px 14px 8px; border-top: 1px solid var(--line-2); }

/* ---------- 關係清單 ---------- */
.rel { display: flex; flex-direction: column; }
.rel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.rel-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rel-col { min-width: 0; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
.rel-col + .rel-col { border-left: 1px solid var(--line); }
.rel-col h3 { font-family: var(--f-serif); font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rel-col h3 small { font-family: var(--f-sans); font-weight: 400; font-size: 12px; color: var(--dim); }
.rlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ritem { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); }
.ritem.top { background: var(--gold-softer); border-color: var(--gold); }
.ritem .sc { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; text-align: center; padding: 3px 0; border-radius: 8px; background: var(--chip); color: var(--ink); }
.ritem.top .sc { background: var(--gold); color: var(--on-accent); }
.ritem .rt { font-weight: 600; font-size: 14.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.ritem .rt .tl { font-family: var(--f-serif); }
.ritem .src { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.ritem .calc { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.toplabel { font-size: 12px; color: var(--gold-ink); font-weight: 600; letter-spacing: .06em; }
.foldbtn { align-self: flex-start; }
.rel-none { color: var(--dim); font-size: 13px; padding: 8px 0; }
@media (max-width: 760px) {
  .rel-cols { grid-template-columns: minmax(0, 1fr); }
  .rel-col + .rel-col { border-left: 0; border-top: 1px solid var(--line); }
}

/* 權重 */
.weights { padding: 16px 20px 20px; border-bottom: 1px solid var(--line); background: var(--card-2); display: flex; flex-direction: column; gap: 14px; }
.wgroups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px 24px; }
.wgroup h4 { margin: 0 0 6px; font-size: 13px; color: var(--gold-ink); letter-spacing: .06em; }
.wslider { display: grid; grid-template-columns: 6.6em minmax(0, 1fr) 3.2em; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; }
.wslider .wl { color: var(--ink-2); }
.wslider .wl small { display: block; color: var(--dim); font-size: 11px; }
.wslider input[type="range"] { width: 100%; accent-color: var(--gold); margin: 0; }
.wslider output { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.wslider.changed .wl { color: var(--gold-ink); font-weight: 600; }

/* ---------- 合盤 ---------- */
.hp-setup { padding: 28px 22px 26px; display: flex; flex-direction: column; gap: 26px; }
.hp-sides { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); gap: 0 24px; align-items: stretch; }
.hp-div { background: var(--line); }
.hp-side { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; min-height: 190px; justify-content: center; text-align: center; }
.hp-side h3 { font-family: var(--f-serif); font-size: 15px; color: var(--dim); font-weight: 400; letter-spacing: .1em; }
.hp-side .btn { min-width: 200px; min-height: 46px; font-size: 15px; }
.hp-chosen { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.hp-chosen .nm { font-family: var(--f-serif); font-size: 19px; font-weight: 700; }
.hp-chosen .gz { font-family: var(--f-serif); font-size: 20px; font-weight: 700; letter-spacing: .14em; }
.hp-go { max-width: 760px; width: 100%; margin: 0 auto; }
.hp-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.hp-panel { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.hp-mini { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r); background: radial-gradient(120% 140% at 0% 0%, var(--bar-2) 0%, var(--bar) 60%); border: 1px solid color-mix(in srgb, var(--bar-ink) 12%, var(--bar)); color: var(--bar-ink); flex-wrap: wrap; }
.hp-mini .sx-ring { width: 40px; height: 40px; font-size: 18px; flex: none; }
.hp-mini > div { flex: 1 1 0; min-width: 0; }                 /* 手機上姓名與日期在中間折行，不把生肖圈和 A／B 擠到別行 */
.hp-mini .side-tag { flex: none; }
.hp-mini .nm { font-family: var(--f-serif); font-weight: 700; font-size: 18px; color: var(--bar-accent); }
.hp-mini .ln { font-size: 12.5px; }
.hp-mini .side-tag { margin-left: auto; font-family: var(--f-serif); font-size: 20px; font-weight: 700; color: var(--bar-accent); }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
.duo > div { padding: 14px 20px; min-width: 0; }
.duo > div + div { border-left: 1px solid var(--line); }
.wxtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.wxtable th, .wxtable td { padding: 6px 6px; border-top: 1px solid var(--line-2); text-align: center; }
.wxtable th { color: var(--dim); font-weight: 400; }
.wxtable td.note { text-align: left; color: var(--ink-2); font-size: 12.5px; }
@media (max-width: 1099px) {
  .hp-panels { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .hp-sides { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .hp-div { height: 1px; }
  .hp-side { min-height: 0; }
  .duo { grid-template-columns: minmax(0, 1fr); }
  .duo > div + div { border-left: 0; border-top: 1px solid var(--line); }
}

/* ---------- 對話框與提示 ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(10, 8, 5, .45); }
.modal-box { width: min(560px, 100%); max-height: min(78vh, 680px); display: flex; flex-direction: column; background: var(--card); border-radius: var(--r); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-body { overflow: auto; padding: 8px 10px; }
.pick { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; text-align: left; padding: 12px 12px; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; border-radius: 8px; color: var(--ink); }
.pick:hover { background: var(--gold-softer); }
.pick .nm { font-family: var(--f-serif); font-weight: 700; font-size: 16px; }
.pick .gz { font-family: var(--f-serif); font-weight: 700; letter-spacing: .1em; }
.pick .mt { grid-column: 1 / -1; font-size: 12.5px; color: var(--dim); }
.cpf { padding: 10px 8px 12px; border-bottom: 1px solid var(--line-2); }
.cpf-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
.cpf-name { font-size: 14px; color: var(--dim); }
.cpf-text { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--gold-softer); border: 1px solid var(--line-2); color: var(--ink); font-family: var(--f-serif); font-size: 15px; line-height: 1.75; letter-spacing: .04em; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
.cpf-hint { margin: 10px 8px 8px; line-height: 1.6; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px; background: var(--bar); color: var(--bar-ink); font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }

/* ---------- 手機細節 ---------- */
@media (max-width: 899px) {
  .card-pad { padding: 16px; }
  .frow { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .seg button { padding: 7px 16px; }
  .now-card { grid-template-columns: auto minmax(0, 1fr); padding: 14px 16px; gap: 12px 16px; }
  .now-side { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; justify-items: start; gap: 2px 14px; }
  .now-side .now-pill { grid-row: span 2; }
  .now-clock { width: 64px; height: 64px; }
  .now-gz { font-size: 20px; letter-spacing: .24em; }
  .case { padding: 12px 14px; grid-template-columns: minmax(0, 1fr); }
  .case-acts { justify-content: flex-start; }
  table.pan { --labw: 38px; }
  table.pan th { font-size: 11.5px; }
  table.pan tr.r-big td { font-size: 27px; }
}
@container (max-width: 460px) {
  table.pan .ssf { display: none; }
  table.pan .ssa { display: inline; }
}
@container (max-width: 520px) {
  table.pan { --labw: 26px; }
  table.pan th { font-size: 11px; padding: 0; }
  table.pan tr.r-head td { font-size: 11px; }
  table.pan tr.r-ss td { font-size: 11px; }
  table.pan tr.r-big td { font-size: 22px; }
  table.pan tr.r-big td .wxs { display: none; }
  table.pan tr.r-cang td { font-size: 10.5px; line-height: 1.5; padding: 6px 0; }
  table.pan tr.r-sm td { font-size: 11px; padding: 4px 0; }
  table.pan tr.r-sha td { font-size: 10px; line-height: 1.4; }
  table.pan td.ph .ph-l { display: none; }
  table.pan td.ph .ph-s { display: inline; }
  /* 納音三個字擠在窄欄會連成一串，讓它照「山下／火」兩字一行分開 */
  table.pan tr[data-row="ny"] td { font-size: 10.5px; line-height: 1.25; padding: 3px 2px; }
  /* 窄欄裡的沖合標記可以折行，不再壓到隔壁格（例如合盤對照時的「B沖日時」） */
  table.pan tr.r-mk td { padding: 3px 0; }
  table.pan tr.r-mk td .mk { font-size: 10px; white-space: normal; word-break: break-all; max-width: calc(100% - 2px); padding: 2px 2px 1px; }
  .pro-left { padding: 6px 4px 10px; }
  .cell { width: 50px; }
  .cell .c-gz, .cell .c-big { font-size: 18px; }
  .strip { grid-template-columns: 36px minmax(0, 1fr); }
  .strip-title { font-size: 16px; }
  .pinfo { grid-template-columns: minmax(0, 1fr); }
  .pinfo-side { flex-direction: row; justify-content: space-between; align-items: center; }
}

/* ---------- 主題 ---------- */
#page-theme { max-width: 1100px; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; margin-top: 16px; }
.theme-card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-align: left; position: relative; }
.theme-card:hover { border-color: var(--gold); }
.theme-card[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.theme-card[aria-pressed="true"]::after { content: "使用中"; position: absolute; top: 4px; right: 4px; font-size: 11.5px; font-weight: 700; color: var(--on-accent); background: var(--gold); border-radius: 6px; padding: 2px 7px; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.tc-prev { display: flex; flex-direction: column; height: 96px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-2); }
.tc-split { flex-direction: row; }
.tc-split > .tc-prev { flex: 1; height: auto; border: 0; border-radius: 0; }
.tc-bar { height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-family: var(--f-serif); font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.tc-bar i { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; }
.tc-body { flex: 1; display: flex; padding: 7px 8px; }
.tc-cardm { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; border-radius: 6px; padding: 5px 7px; }
.tc-gz { font-family: var(--f-serif); font-weight: 700; font-size: 16px; letter-spacing: .04em; white-space: nowrap; }
.tc-sel { display: block; height: 7px; width: 60%; border-radius: 4px; }
.tc-name { display: flex; gap: 8px; align-items: baseline; font-family: var(--f-serif); font-weight: 700; font-size: 15px; }
.tc-name small { font-family: var(--f-sans); font-weight: 400; font-size: 12px; color: var(--dim); }
.cp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 24px; margin: 16px 0 14px; }
.cp { display: grid; grid-template-columns: 6.5em 48px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; cursor: pointer; }
.cp-l small { display: block; font-size: 11.5px; color: var(--dim); }
.cp input[type="color"] { width: 48px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
.cp code { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (max-width: 899px) {
  .theme-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
}

/* ---------- 整柱標記（天剋地沖、天合地合、伏吟） ---------- */
.mk { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; line-height: 1.3; font-weight: 600; white-space: nowrap; padding: 0 4px 0 3px; border-radius: 8px; vertical-align: 1px; }
.mk::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.mk.mk-day::before { width: 9px; height: 9px; }
.mk.mk-day { font-weight: 800; }
.mk-tkdc { color: var(--huo); background: color-mix(in srgb, var(--huo) 12%, transparent); }

<script>
/* ===== ENGINE BEGIN ===== */
/* ==========================================================
   八字排盤計算引擎
   - 干支、五行、十神、長生、納音、旬空等一律用公式
   - 節氣：VSOP87 截斷級數求太陽視黃經（沿用舊版並經驗收用例驗證）
   - 農曆：Meeus 真朔 + 中氣置閏
   ========================================================== */
const Bazi = (() => {
"use strict";

/* ---------------- 1. 編號與基本公式 ---------------- */
const GAN = "甲乙丙丁戊己庚辛壬癸".split("");
const ZHI = "子丑寅卯辰巳午未申酉戌亥".split("");
const WX = "木火土金水".split("");
const SHENGXIAO = "鼠牛虎兔龍蛇馬羊猴雞狗豬".split("");
const mod = (a, n) => ((a % n) + n) % n;

const ganWx = g => g >> 1;                                   // 干：編號整除 2
const ganYang = g => (g & 1) === 0;
const zhiSeason = b => Math.floor(mod(b - 2, 12) / 3);        // 0 春 1 夏 2 秋 3 冬
const SEASON_WX = [0, 1, 3, 4];                               // 木 火 金 水
const zhiWx = b => (mod(b - 2, 12) % 3 === 2) ? 2 : SEASON_WX[zhiSeason(b)]; // 季末為土
const zhiYang = b => (b & 1) === 0;
const gzIndex = (g, b) => ((g & 1) === (b & 1)) ? mod(6 * g - 5 * b, 60) : -1;
const gzName = i => GAN[mod(i, 10)] + ZHI[mod(i, 12)];
const gOf = i => mod(i, 10), bOf = i => mod(i, 12);

/* 十神：(對方五行 − 日主五行) mod 5，陰陽同為偏、異為正 */
const SS_SAME = ["比肩", "食神", "偏財", "七殺", "偏印"];
const SS_DIFF = ["劫財", "傷官", "正財", "正官", "正印"];
const SS_ABBR = { 比肩: "比", 劫財: "劫", 食神: "食", 傷官: "傷", 偏財: "才", 正財: "財", 七殺: "殺", 正官: "官", 偏印: "梟", 正印: "印" };
function tenGod(dm, g) {
  const rel = mod(ganWx(g) - ganWx(dm), 5);
  return ((dm & 1) === (g & 1) ? SS_SAME : SS_DIFF)[rel];
}
/* 藏干（本氣、中氣、餘氣） */
const CANG = [[9], [5, 9, 7], [0, 2, 4], [1], [4, 1, 9], [2, 6, 4], [3, 5], [5, 3, 1], [6, 8, 4], [7], [4, 7, 3], [8, 0]];
const zhiTenGod = (dm, b) => tenGod(dm, CANG[b][0]);

/* 十二長生：陽干順行、陰干逆行；土隨火 */
const CS = ["長生", "沐浴", "冠帶", "臨官", "帝旺", "衰", "病", "死", "墓", "絕", "胎", "養"];
function csStart(g) {
  const s = [0, 1, 1, 2, 3][ganWx(g)];                 // 木 火 土(隨火) 金 水
  return ganYang(g) ? mod(11 + 3 * s, 12) : mod(6 + 3 * s, 12);
}
function csStep(g, b) {
  const st = csStart(g);
  return ganYang(g) ? mod(b - st, 12) : mod(st - b, 12);
}
const changSheng = (g, b) => CS[csStep(g, b)];
const luOf = g => ganYang(g) ? mod(csStart(g) + 3, 12) : mod(csStart(g) - 3, 12); // 臨官 = 祿
const yangRenOf = g => mod(luOf(g) + 1, 12);                                     // 祿前一位

/* 旬空 */
function xunKong(i) { const head = i - mod(i, 10); return [mod(head + 10, 12), mod(head + 11, 12)]; }

/* 納音：大衍數求五行，名稱取 30 組固定名 */
const NAYIN_NAMES = ["海中金", "爐中火", "大林木", "路旁土", "劍鋒金", "山頭火", "澗下水", "城頭土", "白蠟金", "楊柳木",
  "泉中水", "屋上土", "霹靂火", "松柏木", "長流水", "沙中金", "山下火", "平地木", "壁上土", "金箔金",
  "覆燈火", "天河水", "大驛土", "釵釧金", "桑柘木", "大溪水", "沙中土", "天上火", "石榴木", "大海水"];
function nayinWx(i) {
  const p = i - mod(i, 2);
  const dg = g => 9 - (g % 5), dz = b => 9 - (b % 6);
  const s = dg(p % 10) + dz(p % 12) + dg((p + 1) % 10) + dz((p + 1) % 12);
  let r = mod(49 - s, 5); if (r === 0) r = 5;
  const HETU = { 1: 4, 2: 1, 3: 0, 4: 3, 5: 2 };          // 河圖數 → 五行
  return mod(HETU[r] + 1, 5);                            // 所生者為納音
}
const nayin = i => NAYIN_NAMES[Math.floor(mod(i, 60) / 2)];

/* 旺相休囚死（以月支五行為令） */
function wangXiang(mb) {
  const w = zhiWx(mb);
  return [[w, "旺"], [mod(w + 1, 5), "相"], [mod(w + 4, 5), "休"], [mod(w + 3, 5), "囚"], [mod(w + 2, 5), "死"]];
}

/* 人元司令（按入節後天數分配；採《淵海子平》常見分野） */
const SILING = {
  2: [[4, 7], [2, 7], [0, 16]], 3: [[0, 10], [1, 20]], 4: [[1, 9], [9, 3], [4, 18]],
  5: [[4, 5], [6, 9], [2, 16]], 6: [[2, 10], [5, 9], [3, 11]], 7: [[3, 9], [1, 3], [5, 18]],
  8: [[5, 7], [4, 3], [8, 3], [6, 17]], 9: [[6, 10], [7, 20]], 10: [[7, 9], [3, 3], [4, 18]],
  11: [[4, 7], [0, 5], [8, 18]], 0: [[8, 10], [9, 20]], 1: [[9, 9], [7, 3], [5, 18]]
};
function siLing(mb, days) {
  let acc = 0; const list = SILING[mb];
  for (const [g, n] of list) { acc += n; if (days < acc) return g; }
  return list[list.length - 1][0];
}

/* ---------------- 2. 曆算（沿用舊版） ---------------- */
const RAD = Math.PI / 180;

  if (y < 1800) { t = y - 1700; return 8.83 + 0.1603 * t - 0.0059285 * t * t + 0.00013336 * t ** 3 - t ** 4 / 1174000; }
  if (y < 1860) { t = y - 1800; return 13.72 - 0.332447 * t + 0.0068612 * t * t + 0.0041116 * t ** 3 - 0.00037436 * t ** 4 + 0.0000121272 * t ** 5 - 0.0000001699 * t ** 6 + 0.000000000875 * t ** 7; }
  if (y < 1900) { t = y - 1860; return 7.62 + 0.5737 * t - 0.251754 * t * t + 0.01680668 * t ** 3 - 0.0004473624 * t ** 4 + t ** 5 / 233174; }
  if (y < 1920) { t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t ** 3 - 0.000197 * t ** 4; }
  if (y < 1941) { t = y - 1920; return 21.20 + 0.84493 * t - 0.076100 * t * t + 0.0020936 * t ** 3; }
  if (y < 1961) { t = y - 1950; return 29.07 + 0.407 * t - t * t / 233 + t ** 3 / 2547; }
  if (y < 1986) { t = y - 1975; return 45.45 + 1.067 * t - t * t / 260 - t ** 3 / 718; }
  if (y < 2005) { t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }
  if (y < 2050) { t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
  if (y < 2150) { u = (y - 1820) / 100; return -20 + 32 * u * u - 0.5628 * (2150 - y); }
  u = (y - 1820) / 100; return -20 + 32 * u * u;
}

const SHICHEN_RANGE = b => b === 0 ? "23–01" : `${pad2(2 * b - 1)}–${pad2(2 * b + 1)}`;

/* ---------------- 6. 排盤主體 ---------------- */
/*
 input = { name, sex:'m'|'f', y,m,d,hh,mi,ss, tz(小時), dst, lon, lat, trueSolar, zishi:'day23'|'split' }

*/
function buildChart(inp) {
  const tz = inp.tz == null ? 8 : +inp.tz;
  const civil = { y: inp.y, m: inp.m, d: inp.d, hh: inp.hh || 0, mi: inp.mi || 0, ss: inp.ss || 0 };
  const jdCivil = clockToJD(civil);
  const jdUT = jdCivil - tz / 24 - (inp.dst ? 1 / 24 : 0);
  const jdStd = jdUT + tz / 24;                                  // 標準時（已去掉夏令時）

  const lon = inp.lon == null ? tz * 15 : +inp.lon;

    jdClock = jdStd + solarOffsetMin / 1440;
  }
  const clock = jdToClock(jdClock);
  const std = jdToClock(jdStd);

  // 年、月
  const solarYear = solarYearOf(jdUT);
  const yi = yearGZ(solarYear);
  const { prev: prevJie, next: nextJie } = jieAround(jdUT);
  const mb = prevJie.branch;
  const mi = monthGZ(yi, mb);
  // 日、時
  const zishi = inp.zishi || "day23";
  let dayNum = clock.dayNum;
  const hb = hourBranchOf(clock.hh);
  let hourDay = dayNum;
  if (clock.hh >= 23) {
    if (zishi === "day23") { dayNum += 1; hourDay = dayNum; }
    else { hourDay = dayNum + 1; }                              // 夜子時：日柱不換，時干用次日
  }
  const di = dayGZ(dayNum);
  const hi = hourGZ(dayGZ(hourDay), hb);
  const pillars = [yi, mi, di, hi];
  const dm = di % 10;

  // 農曆（以鐘面日期）
  const lunar = lunarOfDay(clock.dayNum);

  // 起運
  const male = inp.sex !== "f";
  const forward = ganYang(yi % 10) === male;                    // 陽男陰女順
  const target = forward ? nextJie : prevJie;
  const diffMin = Math.abs(target.jd - jdUT) * 1440;
  let rem = diffMin * 120;                                      // 三天折一年 ⇔ 時間 ×120
  const qY = Math.floor(rem / 518400); rem -= qY * 518400;      // 每年 360 天
  const qM = Math.floor(rem / 43200); rem -= qM * 43200;        // 每月 30 天
  const qD = Math.floor(rem / 1440); rem -= qD * 1440;
  const qH = Math.floor(rem / 60);
  const jiao = addCalendar(std, qY, qM, qD, qH);                // 交運（標準時）
  const jiaoJD = clockToJD(jiao) - tz / 24;
  const jiaoSolarYear = solarYearOf(jiaoJD);
  const jiaoStem = yearGZ(jiaoSolarYear) % 10;
  const jiaoJie = jieAround(jiaoJD).prev;
  const jiaoLichun = termsOfYear(jiaoSolarYear)[2];
  const birthYear = civil.y;
  const dayun = [];
  for (let k = 0; k < 10; k++) {
    const st = addCalendar(jiao, 10 * k, 0, 0, 0);
    dayun.push({
      k, idx: mod(mi + (forward ? 1 : -1) * (k + 1), 60),
      startYear: jiao.y + 10 * k, startAge: jiao.y + 10 * k - birthYear + 1,
      startJD: clockToJD(st) - tz / 24

  }
  const yun = {
    forward, diffMin, Y: qY, M: qM, D: qD, H: qH, target,
    jiao, jiaoJD, jiaoStems: [jiaoStem, mod(jiaoStem + 5, 10)],
    jiaoJieName: jiaoJie.name, jiaoDaysAfterJie: Math.floor(jiaoJD - jiaoJie.jd),
    jiaoDaysAfterLichun: Math.floor(jiaoJD - jiaoLichun.jd),
    xiaoYunFrom: birthYear, xiaoYunTo: Math.max(birthYear, jiao.y - 1),
    dayun

  // 司令、旺衰、交節
  const daysSinceJie = jdUT - prevJie.jd;
  const siling = siLing(mb, daysSinceJie);
  const ta = termAround(jdUT);
  const nearJie = (jdUT - prevJie.jd) < (nextJie.jd - jdUT) ? { t: prevJie, after: true, dist: jdUT - prevJie.jd } : { t: nextJie, after: false, dist: nextJie.jd - jdUT };
  const boundary = nearJie.dist < 1 ? nearJie : null;

  // 胎命身
  const extra = taiMingShen(pillars);

  return {
    input: Object.assign({}, inp), tz, lon, lat: inp.lat, civil, std, clock, jdUT, jdClock, solarOffsetMin, eot,
    trueSolar: !!inp.trueSolar, dst: !!inp.dst, zishi, sex: male ? "m" : "f", male,
    pillars, dm, solarYear, lunar, prevJie, nextJie, termAround: ta, daysSinceJie, siling, boundary,
    monthBranch: mb, wangxiang: wangXiang(mb), shengxiao: SHENGXIAO[yi % 12],
    yun, extra, birthYear, hourClockBranch: hb
  };
}

/* 只憑四柱成盤（找不到日期時使用；無大運） */
function chartFromPillars(p, sex) {
  const male = sex !== "f";
  return {
    input: { mode: "sizhu" }, pillarsOnly: true, pillars: p.slice(), dm: p[2] % 10, sex: male ? "m" : "f", male,
    monthBranch: p[1] % 12, wangxiang: wangXiang(p[1] % 12), shengxiao: SHENGXIAO[p[0] % 12], extra: taiMingShen(p)
  };
}

/* 胎元、命宮、身宮、胎息 */
function taiMingShen(p) {
  const [yi, mi, di, hi] = p;
  const taiyuan = gzIndex(mod(mi % 10 + 1, 10), mod(mi % 12 + 3, 12));
  const m1 = mod(mi % 12 - 2, 12) + 1, t1 = mod(hi % 12 - 2, 12) + 1;   // 寅=1 … 丑=12
  const mingN = mod(26 - (m1 + t1) - 1, 12) + 1;

  const withStem = n => { const b = mod(n + 1, 12); return monthGZ(yi, b); }; // 五虎遁
  const taixi = gzIndex(mod(di % 10 + 5, 10), mod(1 - di % 12, 12));
  return { taiyuan, minggong: withStem(mingN), shengong: withStem(shenN), taixi };
}

/* ---------------- 7. 歲運 ---------------- */
function currentDayunIndex(chart, jdUT) {       // -1 表示小運期
  const dy = chart.yun.dayun;

  for (let i = 0; i < dy.length; i++) if (jdUT >= dy[i].startJD) k = i;
  return k;
}

  return k;
}

  const yi = yearGZ(Y);
  const out = [];
  for (let k = 0; k < 12; k++) {
    const t = k < 11 ? cur[2 + 2 * k] : nxt[0];
    const t2 = k < 10 ? cur[4 + 2 * k] : (k === 10 ? nxt[0] : nxt[2]);
    const b = mod(2 + k, 12);
    const c = jdToClock(t.jd + tz / 24), c2 = jdToClock(t2.jd + tz / 24);
    out.push({ k, name: t.name, jd: t.jd, endJD: t2.jd, branch: b, idx: monthGZ(yi, b), clock: c, startDay: c.dayNum, endDay: c2.dayNum - 1 });
  }

}

  const out = [];
  for (let dn = month.startDay; dn <= month.endDay; dn++) { const o = dayNumToYMD(dn); out.push({ dayNum: dn, y: o.y, m: o.m, d: o.d, idx: dayGZ(dn) }); }
  return out;
}

  const di = dayGZ(dayNum);
  const out = [];
  for (let b = 0; b < 12; b++) out.push({ branch: b, idx: hourGZ(di, b), range: SHICHEN_RANGE(b) });
  return out;
}
/* 「此刻」：以本地時間（tz 小時）定流年、流月、流日、流時（23 點換日） */
function momentOf(jdUT, tzHours) {
  const tz = tzHours == null ? 8 : tzHours;
  const c = jdToClock(jdUT + tz / 24);
  let dayNum = c.dayNum; if (c.hh >= 23) dayNum += 1;
  const Y = solarYearOf(jdUT);
  const months = liuYue(Y, tz);
  let mk = 0; for (const m of months) if (jdUT >= m.jd) mk = m.k;
  return { Y, monthK: mk, dayNum, hourBranch: hourBranchOf(c.hh), clock: c };
}

/* ---------------- 8. 神煞 ---------------- */
/*

const FUXING = {
  sanming: [[2, 0], [1, 3], [2, 0], [11], [8], [7], [6], [5], [4], [1, 3]], // 甲丙寅子 乙癸丑卯 丁亥 戊申 己未 庚午 辛巳 壬辰
  simple: [[2], [1], [0], [9], [8], [7], [6], [5], [4], [3]]               // 甲寅 乙丑 丙子 丁酉 戊申 己未 庚午 辛巳 壬辰 癸卯
};
const TIANCHU_OLD = [5, 6, 0, 5, 6, 8, 2, 6, 9, 11];                // 甲巳 乙午 丙子 丁巳 戊午 己申 庚寅 辛午 壬酉 癸亥
const CIGUAN = "庚寅 辛卯 乙巳 戊午 丁巳 庚午 壬申 癸酉 癸亥 壬戌".split(" ").map(gzOf); // 依日干甲…癸
const NY_XUETANG = [11, 2, 8, 5, 8];                                // 年納音 木亥 火寅 土申 金巳 水申
const NY_CIGUAN = [2, 5, 11, 8, 11];                                // 年納音 木寅 火巳 土亥 金申 水亥
const TIANDE = { 2: ["g", 3], 3: ["z", 8], 4: ["g", 8], 5: ["g", 7], 6: ["z", 11], 7: ["g", 0], 8: ["g", 9], 9: ["z", 2], 10: ["g", 2], 11: ["g", 1], 0: ["z", 5], 1: ["g", 6] };
const XUEREN = { 2: 1, 3: 7, 4: 2, 5: 8, 6: 3, 7: 9, 8: 4, 9: 10, 10: 5, 11: 11, 0: 6, 1: 0 }; // 月支 → 血刃
const juGroup = b => b % 4;                                   // 0 申子辰 1 巳酉丑 2 寅午戌 3 亥卯未
const juStart = grp => mod(8 - 3 * grp, 12);                  // 長生位
const JU_WX = [4, 3, 1, 0];                                   // 水 金 火 木
const fangOf = b => Math.floor(mod(b + 1, 12) / 3);           // 0 亥子丑 1 寅卯辰 2 巳午未 3 申酉戌
const KUIGANG = gzSet("庚辰 庚戌 壬辰 戊戌");
const JINSHEN = gzSet("乙丑 己巳 癸酉");
const YINCHA = gzSet("丙子 丁丑 戊寅 辛卯 壬辰 癸巳 丙午 丁未 戊申 辛酉 壬戌 癸亥");
const SHIE = gzSet("甲辰 乙巳 壬申 丙申 丁亥 庚辰 戊戌 癸亥 辛巳 己丑");
const RIDE = gzSet("甲寅 丙辰 戊辰 庚辰 壬戌");
const TIANSHE = "戊寅 甲午 戊申 甲子".split(" ").map(gzOf);          // 春 夏 秋 冬

const SHENSHA_ORDER = ["天乙貴人", "太極貴人", "天德貴人", "天德合", "月德貴人", "月德合", "文昌貴人", "國印貴人", "福星貴人", "天廚貴人",
  "學堂", "詞館", "金輿", "祿神", "天醫", "將星", "華蓋", "驛馬", "桃花", "紅鸞", "天喜", "天赦", "日德", "魁罡", "金神",
  "羊刃", "血刃", "劫煞", "亡神", "災煞", "孤辰", "寡宿", "勾絞", "元辰", "喪門", "弔客", "陰差陽錯", "十惡大敗", "空亡"];
const SHENSHA_BAD = new Set(["羊刃", "血刃", "劫煞", "亡神", "災煞", "孤辰", "寡宿", "勾絞", "元辰", "喪門", "弔客", "陰差陽錯", "十惡大敗", "空亡"]);
const SHA_DEFAULT = { ganBase: "dy", zhiBase: "dy", tianyiGeng: "chou", yangren: "next", xuetang: "gan", ciguan: "table", fuxing: "sanming", tianchu: "shishen", kong: "dy" };
const SHA_OPTIONS = [
  { k: "ganBase", title: "以干起查（天乙、太極、文昌、國印、福星、天廚、學堂、詞館）", items: [["dy", "日干與年干"], ["d", "只用日干"]] },
  { k: "zhiBase", title: "以支起查（桃花、驛馬、華蓋、將星、劫煞、亡神）", items: [["dy", "年支與日支"], ["y", "只用年支"]] },
  { k: "tianyiGeng", title: "庚日（年）的天乙貴人", items: [["chou", "丑、未（甲戊庚牛羊）"], ["wu", "午、寅（庚辛逢馬虎）"]] },
  { k: "yangren", title: "陰干的羊刃", items: [["next", "祿前一位（乙辰丁己未辛戌癸丑）"], ["rev", "逆行（乙寅丁己巳辛申癸亥）"], ["none", "陰干不取"]] },
  { k: "xuetang", title: "學堂", items: [["gan", "日干長生（甲亥乙午丙戊寅…）"], ["nayin", "年納音長生（金巳木亥水土申火寅）"]] },
  { k: "ciguan", title: "詞館", items: [["table", "古表干支（甲見庚寅、乙見辛卯…）"], ["nayin", "年納音臨官（金申木寅水土亥火巳）"]] },

function shensha(chart, g, b, pos, opt) {

  const idx = gzIndex(g, b);

  const zrefs = o.zhiBase === "y" ? [[yb, 0]] : [[yb, 0], [db, 2]];
  const out = new Set();
  const add = (n, ok) => { if (ok) out.add(n); };
  // 以日干、年干查
  const tianyi = x => (x === 6 && o.tianyiGeng === "wu") ? [6, 2] : TIANYI[x];
  add("天乙貴人", gans.some(x => tianyi(x).includes(b)));
  add("太極貴人", gans.some(x => TAIJI[x].includes(b)));
  add("文昌貴人", gans.some(x => WENCHANG[x] === b));
  add("國印貴人", gans.some(x => GUOYIN[x] === b));
  add("福星貴人", gans.some(x => FUXING[o.fuxing][x].includes(b)));
  add("天廚貴人", gans.some(x => (o.tianchu === "old" ? TIANCHU_OLD[x] : luOf(mod(x + 2, 10))) === b));
  if (o.xuetang === "nayin") add("學堂", b === NY_XUETANG[nayinWx(p[0])]);
  else add("學堂", gans.some(x => csStart(x) === b));
  if (o.ciguan === "nayin") add("詞館", b === NY_CIGUAN[nayinWx(p[0])]);
  else add("詞館", gans.some(x => CIGUAN[x] === idx));

  add("祿神", b === luOf(ds));
  add("金輿", b === mod(luOf(ds) + 2, 12));
  if (ganYang(ds)) add("羊刃", b === yangRenOf(ds));
  else if (o.yangren === "next") add("羊刃", b === yangRenOf(ds));
  else if (o.yangren === "rev") add("羊刃", b === mod(luOf(ds) - 1, 12));

    add("月德貴人", g === 2 * JU_WX[juGroup(mb)]);

    const st = juStart(juGroup(ref));
    add("桃花", b === mod(st + 1, 12));
    add("亡神", b === mod(st + 3, 12));
    add("將星", b === mod(st + 4, 12));
    add("驛馬", b === mod(st + 6, 12));

    add("紅鸞", b === mod(3 - yb, 12));

    add("勾絞", b === mod(yb + 3, 12) || b === mod(yb - 3, 12));
    add("元辰", b === mod(yb + (chart.male === ganYang(ys) ? 7 : 5), 12));   // 陽男陰女沖後一位，陰男陽女沖前一位
  }

    add("日德", RIDE.has(idx));

}

/* ---------------- 9. 干支關係 ---------------- */
const LIUHE_HUA = { 0: 2, 2: 0, 3: 1, 4: 3, 5: 4, 6: 2 };      // 子丑土 寅亥木 卯戌火 辰酉金 巳申水 午未土

function xingTarget(b) {
  const grp = juGroup(b), role = mod(b - juStart(grp), 12) / 4;
  return mod(FANG_START[grp] + role, 12);

function pillarRel(x, y) {

/* items: [{key,label,kind:'natal'|'dyn', pos?, layer?, side?, idx}] → 原始關係清單 */

}

/* 整柱關係成立時，同一對柱的天干、地支關係收進整柱那一條（sub），不另計分 */
function foldZhu(raw) {
  const key = r => r.m.slice().sort((a, b) => a - b).join(",");
  const zhu = new Map();
  for (const r of raw) if (r.cat === "zhu") zhu.set(key(r), Object.assign({}, r, { sub: [] }));
  if (!zhu.size) return raw.slice();
  const out = [];
  for (const r of raw) {
    if (r.cat === "zhu") { out.push(zhu.get(key(r))); continue; }
    const host = r.m.length === 2 ? zhu.get(key(r)) : null;
    if (host) host.sub.push(r); else out.push(r);
  }
  return out;
}

/*

      if (!(sides.has("A") && sides.has("B"))) continue;          // 合盤只看兩人之間
      if (!dyn.length) {
        let sum = 0, cnt = 0;
        for (let i = 0; i < mem.length; i++) for (let j = i + 1; j < mem.length; j++) {
          const x = mem[i], y = mem[j];

          else if (x.pos === 2 || y.pos === 2) f = W.he.oneDay;

          else f = W.he.other;

      } else {

      }

        for (let i = 0; i < natal.length; i++) for (let j = i + 1; j < natal.length; j++) { sum += distCoef(natal[i].pos, natal[j].pos); cnt++; }
        pos = (sum / cnt) * (natal.some(x => x.pos === 2) ? W.pos.day : 1);
      } else {
        const lc = Math.min(...dyn.map(x => W.layer[x.layer]));
        pos = lc * (natal.some(x => x.pos === 2) ? W.pos.day : 1) * (natal.length ? 1 : W.layer.dyndyn);

/* ---------- 節氣存檔：算過的年份存進瀏覽器，下次打開就讀存檔 ---------- */
const termDisk = (() => {
  const KEY = "bazi.terms.v1";
  let data = null, dirty = false, timer = null;
  const load = () => {
    if (data) return;
    const v = LS.get(KEY, null);
    data = v && v.v === B.TERM_VERSION && v.y && typeof v.y === "object" ? v.y : {};
  };
  const flush = () => {
    clearTimeout(timer); timer = null;
    if (!dirty || !data) return;
    dirty = false;
    const ys = Object.keys(data);
    if (ys.length > 400) ys.sort((a, b) => (data[a].t || 0) - (data[b].t || 0)).slice(0, ys.length - 400).forEach(k => { delete data[k]; });
    LS.set(KEY, { v: B.TERM_VERSION, y: data });
  };
  return {
    get(Y) { load(); const r = data[Y]; return r && Array.isArray(r.j) ? r.j : null; },
    put(Y, j) { load(); data[Y] = { j, t: Date.now() }; dirty = true; if (!timer) timer = setTimeout(flush, 1500); },
    flush
  };
})();
B.setTermStore(termDisk);
window.addEventListener("pagehide", () => termDisk.flush());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") termDisk.flush(); });

/* ---------- 案例存放：登入時存帳戶（私人），否則存瀏覽器 ----------
   status：local（沒有帳戶，只存這個瀏覽器）、connecting（讀取帳戶中）、cloud（已同步）、error（同步中斷）。
   刪除時另寫一筆「已刪除」紀錄（含刪除時間），別台瀏覽器的舊快取就不會把它傳回帳戶。
   判斷規則：案例最後修改時間不晚於刪除時間，就當作已刪除；帳戶裡若被舊版頁面傳回，也會順手清掉。
   刪除之後又重新存檔（修改時間較晚）則算是新的，保留。 */
const clone = o => JSON.parse(JSON.stringify(o));
const Store = {
  cases: LS.get("bazi.cases.v1", []),
  col: null, tomb: null, status: "local", busy: 0, lastSync: 0, failed: 0, rev: 0, subs: new Set(),
  dead: new Map(), purging: new Set(),
  isDead(c) { return this.dead.has(c.id) && this.dead.get(c.id) >= (c.updatedAt || 0); },
  emit() { this.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); },
  sort() { this.cases.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
  saveLocal() { this.rev++; LS.set("bazi.cases.v1", this.cases); },
  get(id) { return this.cases.find(c => c.id === id) || null; },
  async write(fn, failMsg) {
    this.busy++; this.emit();
    try { await fn(); this.lastSync = Date.now(); if (this.status === "error") this.status = "cloud"; }
    catch (e) { this.failed++; if (this.status === "cloud") this.status = "error"; toast(failMsg); }
    finally { this.busy--; this.emit(); }
  },
  async put(c) {
    c.updatedAt = Date.now();
    const i = this.cases.findIndex(x => x.id === c.id);
    if (i >= 0) this.cases[i] = c; else this.cases.unshift(c);
    this.sort(); this.saveLocal(); this.emit();
    const col = this.col, tomb = this.tomb, revive = this.dead.has(c.id);
    if (revive) this.dead.delete(c.id);                            // 刪除後又存檔：撤掉已刪除紀錄
    if (col) await this.write(async () => { await col.doc(c.id).set(clone(c)); if (revive && tomb) await tomb.doc(c.id).delete(); }, "帳戶存檔沒有成功，這個案例先存在本瀏覽器。");
  },
  async remove(id) {
    this.cases = this.cases.filter(c => c.id !== id);
    this.saveLocal(); this.emit();
    const col = this.col, tomb = this.tomb, at = Date.now();
    this.dead.set(id, at);
    if (col) await this.write(async () => { await col.doc(id).delete(); if (tomb) await tomb.doc(id).set({ id, at }); }, "帳戶裡的刪除沒有成功，稍後再試一次。");
  },
  purge(col, list) {                                              // 舊版頁面傳回帳戶的已刪除案例，安靜清掉
    for (const c of list) {
      if (this.purging.has(c.id)) continue;
      this.purging.add(c.id);
      Promise.resolve().then(() => col.doc(c.id).delete()).catch(() => { /* 下次打開再清 */ }).then(() => this.purging.delete(c.id));
    }
  },
  async initCloud() {
    const cl = window.claude;
    if (!cl || typeof cl.use !== "function") return;
    this.status = "connecting"; this.emit();
    const giveUp = () => { this.status = "local"; this.emit(); };
    try {
      const [db, user] = await Promise.all([cl.use("db"), cl.use("user")]);
      if (!db || !user) return giveUp();
      const uid = await user.id();
      if (!uid) return giveUp();
      const base = db.doc("data/users/" + uid + "/bazi");
      const col = base.collection("cases"), tomb = base.collection("deleted");
      try {
        const ts = await tomb.get();
        ts.docs.forEach(d => { const v = d.data ? d.data() : null; const at = v && Number.isFinite(v.at) ? v.at : Infinity; this.dead.set(d.id, Math.max(at, this.dead.get(d.id) || 0)); });
      } catch (e) { /* 讀不到就當作沒有 */ }
      let synced = false;
      this.col = col; this.tomb = tomb; this.known = new Set();
      col.onSnapshot(snap => {
        if (!synced && snap.metadata.fromCache) return;
        const all = snap.docs.map(d => d.data()).filter(x => x && x.id).map(clone);
        const remote = all.filter(c => !this.isDead(c)), liveIds = new Set(remote.map(c => c.id));
        if (!synced) {
          synced = true;
          const localOnly = this.cases.filter(c => !liveIds.has(c.id));
          const missing = localOnly.filter(c => !this.isDead(c));           // 新的，或刪除後又改過的
          const dropped = localOnly.length - missing.length;
          for (const c of missing) this.write(() => col.doc(c.id).set(clone(c)), "有案例沒能存上帳戶，先留在本瀏覽器。");
          this.cases = remote.concat(missing);
          if (dropped) setTimeout(() => toast(`帳戶紀錄顯示有 ${dropped} 個案例已經刪除，這裡也一併移除。`), 400);
        } else {
          const pendingLocal = this.cases.filter(c => !liveIds.has(c.id) && !this.known.has(c.id));
          this.cases = remote.concat(pendingLocal);
        }
        const keep = new Set(this.cases.map(c => c.id));                    // 本機有較新的一份正在補存，就不刪
        const zombies = all.filter(c => this.isDead(c) && !keep.has(c.id));
        if (zombies.length) this.purge(col, zombies);
        this.known = liveIds;
        this.sort(); this.saveLocal(); this.status = "cloud"; this.lastSync = Date.now(); this.emit();
      }, () => { this.col = null; this.tomb = null; this.status = "error"; this.emit(); });
    } catch (e) { this.col = null; this.tomb = null; this.status = "error"; this.emit(); }
  },
  known: new Set()
};
const SYNC_TEXT = {

/* =========================================================
   複製
   命盤表是一列天干、一列地支，瀏覽器照列複製會變成「丙庚壬甲 午寅辰辰」，還夾著五行小字與排版空白。
   在表格裡拖選時改成按柱輸出，範圍取拖選起點與終點兩格圍出的長方形：
   只圍到日期、主星、天干、地支這幾列時，得到「丙午 庚寅 壬辰 甲辰」一行；
   圍到其他列時每列一行、格子用 Tab 隔開（可貼進試算表），天干地支合成「干支」一列。
   還沒選的流日、流時欄（只有「—」）略過；設定裡隱藏的列不算。
   起點與終點在同一格裡（只選一格裡的字）時照瀏覽器原本的方式複製。
   ========================================================= */
const PILLAR_ROWS = new Set(["head", "ss", "gan", "zhi"]);
function cellText(td) {
  if (!td) return "";
  const c = td.cloneNode(true);
  c.querySelectorAll(".sr-only, .ssa, .phhint, .wxs").forEach(n => n.remove());
  const items = c.querySelectorAll(".cg, .sha, .mk");
  if (items.length) return Array.from(items).map(n => n.textContent.replace(/\s+/g, "")).join("、");
  return c.textContent.replace(/\s+/g, "");
}
function boundaryCell(node, off, isEnd) {
  let el = node;
  if (el && el.nodeType === 1 && el.childNodes.length) el = (isEnd ? el.childNodes[off - 1] : el.childNodes[off]) || el;
  if (el && el.nodeType !== 1) el = el.parentElement;
  return el && el.closest ? el.closest("table.pan td, table.pan th") : null;
}
function tableCopyText(sel) {
  if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const cells = [];
  for (let i = 0; i < sel.rangeCount; i++) {
    const r = sel.getRangeAt(i);
    cells.push(boundaryCell(r.startContainer, r.startOffset, false), boundaryCell(r.endContainer, r.endOffset, true));
  }
  if (cells.some(c => !c)) return null;
  const table = cells[0].closest("table.pan");
  if (cells.some(c => c.closest("table.pan") !== table)) return null;
  if (cells.every(c => c === cells[0])) return null;
  const rIdx = cells.map(c => c.parentElement.rowIndex), cIdx = cells.map(c => c.cellIndex);
  const r0 = Math.min(...rIdx), r1 = Math.max(...rIdx);
  const c0 = Math.max(1, Math.min(...cIdx)), c1 = Math.max(...cIdx);
  if (c1 < c0) return null;                                          // 只選到左邊的列名
  const rows = Array.from(table.rows).slice(r0, r1 + 1).filter(tr => tr.getClientRects().length);   // 設定裡隱藏的列不算
  const keys = rows.map(tr => tr.dataset.row);
  const ganRow = table.querySelector('tr[data-row="gan"]');
  const cols = []; for (let i = c0; i <= c1; i++) if (!(ganRow && ganRow.cells[i] && ganRow.cells[i].classList.contains("ph"))) cols.push(i);   // 還沒選的流日、流時欄不算
  if (!cols.length) return null;
  const gan = rows.find(tr => tr.dataset.row === "gan"), zhi = rows.find(tr => tr.dataset.row === "zhi");
  const gz = i => (gan ? cellText(gan.cells[i]) : "") + (zhi ? cellText(zhi.cells[i]) : "");
  if ((gan || zhi) && keys.every(k => PILLAR_ROWS.has(k))) return cols.map(gz).join(" ");
  const head = table.querySelector('tr[data-row="head"]');
  const line = (label, vals) => [label].concat(vals).join("\t");
  const out = head ? [line(cellText(head.cells[0]), cols.map(i => cellText(head.cells[i])))] : [];
  for (const tr of rows) {
    const k = tr.dataset.row;
    if (k === "head" || (k === "zhi" && gan)) continue;
    if (k === "gan" && zhi) { out.push(line("干支", cols.map(gz))); continue; }
    out.push(line(cellText(tr.cells[0]), cols.map(i => cellText(tr.cells[i]))));
  }
  return out.join("\n");
}
/* 抬頭的「複製」：三種格式，都不含姓名 */
function copyFormats(chart) {
  const gz = chart.pillars.map(B.gzName).join(" ");
  const zao = `${chart.male ? "乾造" : "坤造"} ${gz}`;
  const lines = [zao];
  if (chart.pillarsOnly) lines.push("日期未定（四柱直排）");
  else {
    lines.push(`公曆 ${fmtDash(chart.civil)}（${tzText(chart.tz)}${chart.dst ? "・夏令時" : ""}）`);
    if (chart.trueSolar) lines.push(`真太陽時 ${fmtDash(chart.clock)}`);
    lines.push(`農曆 ${B.lunarText(chart.lunar)} ${ZHI[chart.pillars[3] % 12]}時`);
    const y = chart.yun;

async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* 改用舊方法 */ }
  const back = document.activeElement;
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.setAttribute("aria-hidden", "true");
  ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none";
  document.body.appendChild(ta); ta.select();

function proCols(chart, sel) {
  const cols = [];
  const months = B.liuYue(sel.year, localTz());
  const hasM = sel.mk != null, hasD = sel.dn != null, hasH = sel.hb != null;
  cols.push(hasH && hasD ? { title: "流時", idx: B.hourGZ(B.dayGZ(sel.dn), sel.hb), kind: "dyn", layer: "liushi", label: "流時" } : { title: "流時", idx: null, layer: "liushi", ph: hasD ? "點流時" : "先選流日" });
  cols.push(hasD ? { title: "流日", idx: B.dayGZ(sel.dn), kind: "dyn", layer: "liuri", label: "流日" } : { title: "流日", idx: null, layer: "liuri", ph: hasM ? "點流日" : "先選流月" });
  cols.push(hasM ? { title: "流月", idx: months[sel.mk].idx, kind: "dyn", layer: "liuyue", label: "流月" } : { title: "流月", idx: null, layer: "liuyue", ph: "點流月" });

  else cols.push({ title: "大運", idx: null, layer: "dayun", ph: "未出生" });
  natalCols(chart, false).forEach((c, i) => { c.sep = i === 0; c.label = c.title; cols.push(c); });
  return cols;
}
function dynItems(cols, side) {
  return cols.filter(c => c.kind === "dyn" && c.idx != null).map(c => ({ label: c.label, short: c.label, kind: "dyn", layer: c.layer, idx: c.idx, side: side || "A" }));
}
function cellToday(level, v, now, chart) {

  if (level === "day") return v === now.dayNum;

}
function stripHTML(pid, key, cls, title, sub, cells) {

const TODAY_SR = `<span class="sr-only">（今天）</span>`;
function stripsHTML(pid, chart, sel, x) {

/* ---------- 干支條捲軸 ----------
   先一次量完所有條的位置，再一起設定捲動與捲軸（避免每條各自觸發一次整頁排版）。 */
const stripPos = new Map();
const thumbRO = window.ResizeObserver ? new ResizeObserver(entries => {
  const list = entries.map(en => en.target.__strip).filter(Boolean);
  const ms = list.map(measureStrip);
  list.forEach((pl, i) => paintStrip(pl, ms[i]));
}) : null;
function measureStrip(pl) {
  const t = pl.track;
  return { max: t.scrollWidth - t.clientWidth, cw: t.clientWidth, sw: t.scrollWidth, left: t.scrollLeft, rw: pl.rail.clientWidth };
}
function paintStrip(pl, m) {
  const max = Math.max(0, m.max);
  pl.st.classList.toggle("fits", max <= 1);
  const tw = Math.max(28, m.rw * m.cw / Math.max(1, m.sw));
  const x = max > 0 ? (m.left / max) * (m.rw - tw) : 0;
  pl.thumb.style.width = tw + "px"; pl.thumb.style.transform = `translateX(${x}px)`;
  pl.bl.disabled = m.left <= 1; pl.br.disabled = m.left >= max - 1;
  stripPos.set(pl.id, { key: pl.key, left: m.left });
}
function setupStrips(root) {
  // 1. 讀：位置一次量完
  const plans = $$(".strip", root).map(st => {
    const track = $(".strip-track", st), id = st.dataset.strip, key = st.dataset.key;
    const [bl, br] = $$(".sbar-btn", st);
    const pl = { st, track, id, key, rail: $(".sbar-rail", st), thumb: $(".sbar-thumb", st), bl, br, left: 0 };
    const prev = stripPos.get(id);
    if (prev && prev.key === key) pl.left = prev.left;
    else {
      const el = $('.cell[aria-pressed="true"]', track) || $(".cell.today", track);
      if (el) pl.left = Math.max(0, el.offsetLeft - (track.clientWidth - el.offsetWidth) / 2);
    }
    return pl;
  });
  // 2. 寫：捲動位置與事件
  for (const pl of plans) {
    const { track, rail, thumb, bl, br } = pl;
    track.scrollLeft = pl.left;
    track.__strip = pl;
    track.addEventListener("scroll", () => paintStrip(pl, measureStrip(pl)), { passive: true });
    const step = () => Math.max(120, track.clientWidth * 0.8);
    bl.addEventListener("click", () => track.scrollBy({ left: -step(), behavior: "smooth" }));
    br.addEventListener("click", () => track.scrollBy({ left: step(), behavior: "smooth" }));
    let drag = null;
    thumb.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); try { thumb.setPointerCapture(e.pointerId); } catch (x) { /* 舊瀏覽器 */ } drag = { x: e.clientX, left: track.scrollLeft }; });
    thumb.addEventListener("pointermove", e => {
      if (!drag) return;
      const max = track.scrollWidth - track.clientWidth, room = rail.clientWidth - thumb.offsetWidth;
      track.scrollLeft = drag.left + (e.clientX - drag.x) * (max / Math.max(1, room));
    });
    const end = () => { drag = null; };
    thumb.addEventListener("pointerup", end); thumb.addEventListener("pointercancel", end); thumb.addEventListener("lostpointercapture", end);
    rail.addEventListener("pointerdown", e => {
      if (e.target === thumb) return;
      const r = rail.getBoundingClientRect(), max = track.scrollWidth - track.clientWidth;
      const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      track.scrollTo({ left: ratio * max, behavior: "smooth" });
    });
  }
  // 3. 捲軸：先全部量，再全部畫
  const ms = plans.map(measureStrip);
  plans.forEach((pl, i) => paintStrip(pl, ms[i]));
  if (thumbRO) plans.forEach(pl => thumbRO.observe(pl.track));
}

/* 流年同時牽動兩人：今年前十年到後二十年，同一流年對兩人原局都是天剋地沖（或都是天合地合） */

      if (a && b) found[t].push({ Y, i, a, b });

  const none = t => `<span class="dim">${never(t) ? `這段期間沒有；兩人原局的組合下，六十甲子裡沒有任何一年會同時${t === "tkdc" ? "沖" : "合"}到兩人` : "這段期間沒有"}</span>`;

  return `<div class="card hpx hp-both"><div class="card-pad" style="padding-bottom:6px"><h2 class="card-title">流年同時牽動兩人<small>${from}–${to} 年；點年份，兩邊細盤一起跳到那一年</small></h2></div>
    <div class="yr-rows">${row("tkdc", "同時天剋地沖")}${row("thdh", "同時天合地合")}</div></div>`;
}
function pairStaticHTML(cA, cB, A, Bc, colsA, colsB) {

  // 五行互補
  const count = ch => { const n = [0, 0, 0, 0, 0]; ch.pillars.forEach(p => { n[B.ganWx(p % 10)]++; n[B.zhiWx(p % 12)]++; }); return n; };
  const nA = count(A), nB = count(Bc);

  // 關係
  const items = natalItems(A, "A").concat(natalItems(Bc, "B"));
  if (colsA && colsB) {
    colsA.filter(c => c.kind === "dyn" && c.idx != null && (c.layer === "dayun" || c.layer === "xiaoyun")).forEach(c => items.push({ label: "A " + c.label, short: c.label, kind: "dyn", layer: c.layer, idx: c.idx, side: "A" }));

  }

    return;
  }
  if (!t.closest("#f-form")) return;
  if (t.id === "f-sy" || t.id === "f-sm") rebuildDays();
  if (t.id === "f-ly") rebuildLunarMonths();
  if (t.id === "f-lm") rebuildLunarDays();
  if (t.id === "f-place") { if (t.value !== "custom") setPlaceByIndex(+t.value); }
  if (t.id === "f-lon" || t.id === "f-lat") $("#f-place").value = "custom";
  if (t.id === "f-save") { S.prefs.autosave = t.checked; savePrefs(); }
  if (/^f-p\d$/.test(t.id) || t.id === "f-tz") { S.candPick = null; if (S.mode === "sizhu") renderCands(); }
  if (t.name === "f-cand") S.candPick = +t.value;
  updatePreview();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches('input[type="range"][data-wg]')) { onWeightInput(t); return; }
  if (t.matches('input[type="color"][data-cp]')) { onCustomColor(t); return; }
  if (t.id === "case-filter") { S.ui.filter = t.value.trim(); const pos = t.selectionStart; renderCases(); const f = $("#case-filter"); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) { /* 無妨 */ } } return; }
  if (t.id === "f-lon" || t.id === "f-lat" || t.id === "f-name") { if (t.id !== "f-name") $("#f-place").value = "custom"; updatePreview(); }
});
document.addEventListener("copy", e => {
  const text = tableCopyText(document.getSelection());
  if (text == null || !e.clipboardData) return;
  e.clipboardData.setData("text/plain", text);
  e.preventDefault();
});
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.sha-sw")) S.ui.shaOpen = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  if (e.key === "Enter" && e.target.id && e.target.id.startsWith("rn-")) { const b = document.querySelector(`[data-act="case-rename-save"][data-id="${e.target.id.slice(3)}"]`); if (b) b.click(); }
});
$("#f-form").addEventListener("submit", e => { e.preventDefault(); submitForm(); });

/* ---------- 啟動 ----------
   先畫框架（導覽列與目前頁的佔位），下一個畫面再算命盤；看到哪頁才算哪頁。 */
const HEAVY = ["basic", "pro", "hepan", "cases"];
function showFrame(page) {
  S.page = page;
  $$(".page").forEach(p => { p.hidden = p.id !== "page-" + page; });
  $$(".nav-item").forEach(b => b.setAttribute("aria-current", b.dataset.page === page ? "page" : "false"));
  const box = page === "cases" ? $("#cases-card") : $("#page-" + page);
  if (box) box.innerHTML = `<div class="${page === "cases" ? "" : "card "}loading" aria-busy="true"><span class="ld-bar"></span><span>${page === "cases" ? "正在讀取案例…" : "正在排盤…"}</span></div>`;
}
function init() {
  applyTheme();
  applyHide();
  const saved = LS.get("bazi.cur.v1", null);
  if (saved && validCase(saved.c)) setCurrent(saved.c, saved.saved);
  Store.sort();
  checkCurSaved();
  Store.subs.add(() => {
    renderSync();
    checkCurSaved();
    if (S.page === "cases" && S.ui.casesRev !== Store.rev) renderCases();
    if (S.page === "hepan" && !S.hepan.started) renderHepan();
  });
  renderSync();
  let page = (location.hash || "").replace("#", "");
  if (!PAGES.includes(page)) page = LS.get("bazi.page", "input");
  if (!PAGES.includes(page) || ((page === "basic" || page === "pro") && !S.cur)) page = "input";
  if (HEAVY.includes(page)) {
    showFrame(page);
    const boot = () => { if (!S.booted) go(page, { keepScroll: true }); };
    if (window.requestAnimationFrame) requestAnimationFrame(() => setTimeout(boot, 0)); else setTimeout(boot, 0);
  } else go(page);
  setInterval(() => tickNow(false), 1000);
  Store.initCloud();
}
init();
})();

</script>
